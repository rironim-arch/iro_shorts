name: Long-form script asset retrieval (one-off)
on:
  push:
    paths:
      - senior_story_bundle_request.json
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle original narration text
        run: |
          mkdir -p bundled_story
          cp senior_story_01.json bundled_story/
      - uses: actions/upload-artifact@v4
        with:
          name: senior-story-script
          path: bundled_story/*
          retention-days: 3
