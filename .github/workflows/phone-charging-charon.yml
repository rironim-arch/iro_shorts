name: 생활알고리즘 휴대폰 충전 Charon 음성
on:
  push:
    paths:
      - '.github/workflows/phone-charging-charon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "google-genai>=1,<2"
      - name: Generate original Charon narration
        run: python phone_charge_heat_charon.py
      - name: Save recorded speech and scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-charging-heat-charon
          path: out_phone_heat_charon/*
          retention-days: 14
          if-no-files-found: warn
