name: Two Shorts - heater comparison and phone battery
on:
  push:
    paths:
      - 'two_shorts_charon_and_motion.py'
      - '.github/workflows/two-shorts-gemini-charon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio/video dependencies
        run: python -m pip install --disable-pip-version-check "google-genai>=1,<3" requests imageio-ffmpeg
      - name: Render 2 unique Charon narrations and moving stock assets
        run: python -u two_shorts_charon_and_motion.py
      - name: Upload audio, timings and licensed footage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-life-algorithm-shorts-source-assets
          path: |
            two_shorts_assets/*.wav
            two_shorts_assets/*_manifest.json
            two_shorts_assets/*.mp4
            two_shorts_assets/sources.txt
            two_shorts_assets/stock_status.json
          if-no-files-found: warn
          retention-days: 14
