name: Kimchi stain - legacy layout REAL motion and Charon
on:
  push:
    paths:
      - '.github/workflows/kimchi-motion-charon.yml'
      - 'kimchi_corrected_motion_short.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_ACTION_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install portable dependencies
        run: |
          python -m pip install --disable-pip-version-check "google-genai>=1,<3" "Pillow>=10,<13" requests imageio-ffmpeg
      - name: Render review MP4 with actual moving stock, original white layout, Gemini Charon
        run: python -u kimchi_corrected_motion_short.py
      - name: Save video and proof for manual review (never uploads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimchi-motion-charon-review
          path: |
            kimchi_motion_review/kimchi_corrected_charon_motion.mp4
            kimchi_motion_review/subtitles.srt
            kimchi_motion_review/script.txt
            kimchi_motion_review/sources.txt
            kimchi_motion_review/quality.json
            kimchi_motion_review/caption_03.png
            kimchi_motion_review/caption_04.png
            kimchi_motion_review/caption_05.png
          retention-days: 14
          if-no-files-found: warn
