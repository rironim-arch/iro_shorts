name: Public YouTube Shorts inventory
on:
  push:
    paths:
      - '.github/workflows/public-shorts-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List public uploads
        run: |
          python -m pip install -q --disable-pip-version-check yt-dlp
          python - <<'PY'
          import json,subprocess
          urls=[
            "https://www.youtube.com/channel/UCsnDatcyPI0XIo7JFu3Df6g/shorts",
            "https://www.youtube.com/channel/UCsnDatcyPI0XIo7JFu3Df6g/videos",
          ]
          for url in urls:
            print("START",url,flush=True)
            try:
              p=subprocess.run(["yt-dlp","--ignore-errors","--flat-playlist","--playlist-end","60","--dump-single-json",url],text=True,capture_output=True,timeout=250)
              print("RETURN",p.returncode,"STDERR",p.stderr[-1500:],flush=True)
              if p.stdout:
                obj=json.loads(p.stdout)
                print("ENTRIES",len(obj.get("entries",[])),flush=True)
                for e in obj.get("entries",[]):
                  if e:print("VIDEO",json.dumps({"id":e.get("id"),"title":e.get("title"),"duration":e.get("duration"),"url":e.get("url")},ensure_ascii=False),flush=True)
            except Exception as e: print("ERROR",repr(e),flush=True)
          PY
