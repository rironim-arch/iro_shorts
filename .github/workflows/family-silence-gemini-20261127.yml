name: Family silence Gemini acting
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/family-silence-gemini-20261127.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Generate dialogue groups with Gemini direct REST
        run: |
          python -u - <<'PY'
          from pathlib import Path
          import os,json,urllib.request,urllib.error,base64,wave,time,concurrent.futures,io
          GROUPS=json.loads("[[\"f\",\"요즘 젊은 것들은 끈기가 없어. 조금만 힘들면 그만두고 말이야.\",\"Dismissive habitual complaint over dinner, natural conversational Korean, not yelling.\"],[\"d\",\"아빠, 요즘은 옛날하고 좀 달라.\",\"Adult daughter gently disagreeing, tentative but sincere.\"],[\"f\",\"뭐가 달라? 사람 사는 게 다 똑같지. 네가 인생을 얼마나 살아봤다고.\",\"Interrupting confidently, patronizing but ordinary, slightly sharper.\"],[\"d\",\"응… 아빠 말이 맞아.\",\"Quiet resignation, not agreement; a short pause after 응.\"],[\"n\",\"얼마 후, 가족들이 모처럼 식사를 하는 자리였습니다.\",\"Brief neutral transition.\"],[\"f\",\"너희는 왜 아빠가 없을 때만 그렇게 재미있게 떠들어? 내가 오면 조용해지고.\",\"Hurt and puzzled, genuinely doesn't understand.\"],[\"s\",\"아니에요. 그냥 별 얘기 안 했어요.\",\"Adult son awkwardly avoiding confrontation.\"],[\"f\",\"뭐 서운한 거 있어? 있으면 말을 해.\",\"Apparently open but impatient.\"],[\"d\",\"말하면 들어줄 거야?\",\"Quietly skeptical, careful eye contact.\"],[\"f\",\"당연하지. 아빠가 틀린 말 하는 사람이냐?\",\"Instantly defensive, self-assured, unaware of contradiction.\"],[\"d\",\"아니야. 됐어.\",\"A small pause before speaking, disappointed, gives up, voice trails naturally but final syllables audible.\"],[\"n\",\"그날 저녁, 아버지는 아내에게 서운함을 털어놓았습니다.\",\"Short reflective transition.\"],[\"f\",\"내가 평생 가족을 위해 살았는데, 애들이 왜 나를 어려워하는지 모르겠어.\",\"Genuine sadness and frustration, not theatrical.\"],[\"w\",\"당신은 평생 애들한테 할 말은 많았지만, 애들이 당신한테 하고 싶은 말에는 관심이 없었잖아.\",\"Mature wife, calmly speaking hard truth after years of frustration.\"],[\"f\",\"아니, 그게 아니라 내 말은…\",\"Reflexively interrupting, defensive, unfinished thought.\"],[\"w\",\"봐. 지금도 내 말을 끝까지 안 듣잖아.\",\"Quietly firm, disappointed rather than angry; allow the line to land.\"],[\"n\",\"자기 생각이 확고한 것과 고집이 센 것은 다릅니다. 소신이 있는 사람은 다른 사람의 의견을 듣고 판단하지만, 고집이 센 사람은 자신의 생각을 지키기 위해 상대방의 말을 부정합니다.\",\"Measured and reflective, natural phrasing, no sermon tone.\"],[\"n\",\"사람들이 더 이상 당신에게 반박하지 않는다고 해서 당신이 옳다는 뜻은 아닙니다. 어쩌면 당신과 대화하는 것 자체를 포기했는지도 모릅니다.\",\"Quietly impactful, natural pause between sentences.\"],[\"n\",\"이 이야기가 마음에 남으셨다면 구독과 좋아요 부탁드립니다.\",\"Warm natural closing.\"]]")
          OUT=Path("family_silence_audio");OUT.mkdir(exist_ok=True)
          key=os.environ["GEMINI_API_KEY"]
          voices={"n":"Charon","f":"Algenib","d":"Kore","s":"Orus","w":"Gacrux"}
          styles={"n":"Natural Korean reflective narrator.","f":"Korean father in his late fifties, grounded mature male.","d":"Korean adult daughter in her late twenties.","s":"Korean adult son in his early thirties.","w":"Korean mother in her mid fifties, mature and natural."}
          def generate(item):
           i,(role,script,acting)=item
           dest=OUT/f"raw_{i:02d}.wav"
           payload={"model":"gemini-3.8-flash-tts","input":[{"type":"user_input","content":[{"type":"text","text":script,"annotations":[{"type":"speech_metadata","style":styles[role]+" "+acting+" Natural Korean, steady conversational pace, natural connected phrasing, no shouting, no unnatural breathiness, no rushed syllables. Read exactly the full text, no additions. Finish final syllables clearly."}]}]}],"response_format":{"type":"audio"},"generation_config":{"speech_config":[{"voice":voices[role]}]}}
           for attempt in range(3):
            try:
             print("REQUEST",i,attempt+1,flush=True)
             req=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/interactions",data=json.dumps(payload).encode(),headers={"Content-Type":"application/json","x-goog-api-key":key})
             with urllib.request.urlopen(req,timeout=45) as response:r=json.load(response)
             audio=[c for s in r.get("steps",[]) for c in s.get("content",[]) if c.get("type")=="audio" and c.get("data")]
             if not audio:raise RuntimeError("No audio: "+str(r.get("status")))
             data=base64.b64decode(audio[-1]["data"])
             if data[:4]==b"RIFF":dest.write_bytes(data)
             else:
              with wave.open(str(dest),"wb") as w:
               w.setnchannels(1);w.setsampwidth(2);w.setframerate(24000);w.writeframes(data)
             with wave.open(str(dest)) as w:d=w.getnframes()/w.getframerate()
             if d<0.4:raise RuntimeError("Empty audio")
             record={"i":i,"role":role,"voice":voices[role],"text":script,"file":dest.name,"duration":d}
             (OUT/f"line_{i:02d}.json").write_text(json.dumps(record,ensure_ascii=False),encoding="utf8")
             print("GENERATED",i,round(d,2),flush=True)
             time.sleep(9)
             return record
            except Exception as e:
             print("ERROR",i,attempt+1,str(e).replace(key,"[redacted]")[:350],flush=True)
             if isinstance(e,urllib.error.HTTPError) and e.code==429:print('RATE_LIMIT',flush=True)
             if attempt==2:return {"i":i,"error":str(e).replace(key,"[redacted]")}
             time.sleep(65 if isinstance(e,urllib.error.HTTPError) and e.code==429 else 3)
          with concurrent.futures.ThreadPoolExecutor(max_workers=1) as ex:
           records=list(ex.map(generate,list(enumerate(GROUPS,1))))
          t=0
          for r in records:
           if "duration" in r:r["start"]=round(t,4);t+=r["duration"];r["end"]=round(t,4)
          (OUT/"manifest.json").write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding="utf8")
          print("TOTAL",round(t,3),"SUCCESS",sum("duration" in r for r in records),flush=True)
          if any("error" in r for r in records):raise SystemExit(1)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-silence-voices
          path: family_silence_audio/
          retention-days: 7
