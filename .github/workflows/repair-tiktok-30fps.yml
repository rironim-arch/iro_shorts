name: Repair legacy TikTok clips to constant 30fps
on:
  push:
    paths:
      - '.github/workflows/repair-tiktok-30fps.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install video tooling
        run: python -m pip install -q --disable-pip-version-check imageio-ffmpeg
      - name: Reencode already imported public videos to CFR 30
        run: |
          python - <<'PY'
          import os,subprocess,urllib.request,json,imageio_ffmpeg
          urls=json.loads(r'''{"oldfriend":"https://storage.googleapis.com/vidiq-user-videos/e12c8422-2c00-4502-b8d1-ce48b534a1a2/ee81bb3b-fe70-4b59-a989-142ba181f6fd.mp4?GoogleAccessId=ai-proxy-20261001%40studious-pen-429.vid.io.iam.gserviceaccount.com&Expires=1795843894&Signature=b2ypB70EOQ2ooZklyLKO1pcWPnIof5eUvam2IdVScX8Oxo%2BHoMXV3SG5dRh2Lz4S5izJKfvqV9%2FLloT7hMr984Qe%2B3Wn4e3gwYoQFbqZO7AP4FWC%2BxbKjvDZbVnxpPOkh7ccxThAgDrD3YJOh%2B8%2FNB%2FhbEeU%2BDOc90yMXR3owoxR0%2FQiA1Z%2F2EitQv%2F69FQC2ckcSkKT82A0oVsgE7I%2BHzjk784vw64U4ElbugFhUIdBmaR7bLvWWIYyT3WrdK13Jdmt5eavD5QuniTftodPMh%2FiGCOGgnnKyIAYibkXA04%2BELQAMj6LsZazoub3xcktf6d5Qp8XdftXPmXy2thGYg%3D%3D","wardog":"https://storage.googleapis.com/vidiq-user-videos/e12c8422-2c00-4502-b8d1-ce48b534a1a2/ba2db11c-3de6-4fbd-bde0-bad9c3f0a0c3.mp4?GoogleAccessId=ai-proxy-20261001%40studious-pen-429.vid.io.iam.gserviceaccount.com&Expires=1795843895&Signature=sQEehWKPliuRz3kU%2F34MfF961Pg9b0Ay4cS2yRWIetwhY6qMyxGrmQipYUJrDfumuArVH7gvcsVbtA5NMKCGR6EPpy2ae8u%2FOyiVmVq5jxgOIGJ7RFMrfv6MQQl9e5o6cghHnwf3KBw1ywNF5FPRjwqEWZ9tw0CrRmkMcmQUw9539jdw80XS12fZpZ7wwHa1flgdUw11CJn%2BNNKnduwc5ekuOLf2fCnaUk5Gj1s6GobKzfEDaLTAF%2F4EJ2tqrlFJ79svXQomdPgs6kiFMSuOVzH6nZWJneZ5VUpOVV1o3Zbtc0UvAvN8zfyTSAhHIlnk2PLt0a3SU9XO%2Bsl6pCoC2A%3D%3D"}''')
          os.makedirs("outputs",exist_ok=True)
          ff=imageio_ffmpeg.get_ffmpeg_exe()
          for name,url in urls.items():
            src=f"{name}_src.mp4"
            print("DOWNLOAD",name,flush=True)
            urllib.request.urlretrieve(url,src)
            dst=f"outputs/{name}_30fps.mp4"
            print("REENCODE",name,flush=True)
            subprocess.run([ff,"-hide_banner","-loglevel","error","-y","-i",src,
              "-vf","fps=30,scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2",
              "-r","30","-fps_mode","cfr","-c:v","libx264","-preset","veryfast",
              "-crf","23","-pix_fmt","yuv420p","-video_track_timescale","30000",
              "-c:a","aac","-b:a","128k","-ar","48000","-movflags","+faststart",dst],check=True)
            print("REPAIRED",name,os.path.getsize(dst),flush=True)
          PY
      - name: Make temporary download URLs for vidIQ import
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "shorts-cfr30-transfer-20261121" outputs/*.mp4 --repo "${{ github.repository }}" --target main --title "Temporary 30fps social transfer" --notes "Temporary copies of already-public Shorts for TikTok compatibility."
          gh release view "shorts-cfr30-transfer-20261121" --repo "${{ github.repository }}" --json assets --jq '.assets[]|.name+" "+.url'
