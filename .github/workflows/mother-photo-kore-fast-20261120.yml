name: Mother Photo Kore Voice Fast
on:
  push:
    paths:
      - '.github/workflows/mother-photo-kore-fast-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini SDK
        run: python -m pip install "google-genai>=1,<3" imageio-ffmpeg
      - name: Generate Kore narration and subtitles
        run: python -u mother_photo_kore_20261120.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mother-photo-kore-fast-audio
          path: |
            mother_photo_kore_output/*.wav
            mother_photo_kore_output/*.mp3
            mother_photo_kore_output/*.json
            mother_photo_kore_output/*.srt
          retention-days: 14
          if-no-files-found: warn
