name: Cafe mom missing effort Gemini TTS
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cafe-mom-effort-patch-20261123.yml
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Create and validate missing story bridge
        run: python -u cafe_mom_effort_patch_20261123.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cafe-mom-effort-Gemini-Kore
          path: cafe_mom_effort_patch/
          retention-days: 7
