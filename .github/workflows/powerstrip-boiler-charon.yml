name: 생활알고리즘 멀티탭과 보일러 Gemini Charon 검토용 MP4
on:
  push:
    paths:
      - 'make_powerstrip_boiler_charon_shorts.py'
      - '.github/workflows/powerstrip-boiler-charon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install -q "google-genai>=1,<3" "Pillow>=10,<13" "requests>=2.31,<3" "numpy>=1.26,<3"
          python -m py_compile make_powerstrip_boiler_charon_shorts.py
      - name: Render 2 Shorts with Gemini Charon, no publishing
        run: |
          test -n "$GEMINI_API_KEY"
          python -u make_powerstrip_boiler_charon_shorts.py
      - name: Upload review MP4, scripts, captions, and sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 생활알고리즘-멀티탭-보일러-Gemini-Charon-MP4
          path: |
            powerstrip_boiler_exports/*.mp4
            powerstrip_boiler_exports/*.srt
            powerstrip_boiler_exports/*.txt
            powerstrip_boiler_exports/*.json
          if-no-files-found: warn
          retention-days: 14
