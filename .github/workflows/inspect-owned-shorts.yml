name: Extract public owned YouTube channel Shorts catalog
on:
  push:
    paths:
      - '.github/workflows/inspect-owned-shorts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check yt-dlp requests
      - run: python -u inspect_owned_shorts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-youtube-shorts-catalog
          path: youtube_channel_manifest.json
          retention-days: 1
          if-no-files-found: warn