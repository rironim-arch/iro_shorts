name: Audit every elder line ending for lost final syllables
on:
  push:
    paths:
      - '.github/workflows/father-all-lines-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'faster-whisper>=1.1,<2'
      - run: python -u qa_father_all_lines.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: father-all-lines-asr-report
          path: father_all_lines_qa/line_qa.json
          retention-days: 7