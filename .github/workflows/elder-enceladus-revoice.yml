name: Replace old father voice with Gemini Enceladus
on:
  push:
    paths:
      - '.github/workflows/elder-enceladus-revoice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "google-genai>=1,<3" "faster-whisper>=1.1,<2"
      - run: python -u father_enceladus_revoice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: father-enceladus-voice-clips
          path: |
            father_enkel_voice/*.wav
            father_enkel_voice/*.json
            father_enkel_voice/*.txt
          retention-days: 7
          if-no-files-found: warn