name: 생활알고리즘 새로운 영상 틀 가습기 Charon 원테이크
on:
  push:
    paths:
      - '.github/workflows/humidifier-template-charon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'google-genai>=1,<2'
      - name: Record Charon continuous educational hook
        run: python humidifier_template_charon.py
      - name: Upload voice and script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humidifier-new-template-one-take
          path: out_humidifier_template/*
          retention-days: 14
          if-no-files-found: warn
