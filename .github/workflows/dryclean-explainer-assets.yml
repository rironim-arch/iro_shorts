name: dry cleaning explainer assets - Charon and actual motion
on:
  push:
    paths:
      - '.github/workflows/dryclean-explainer-assets.yml'
      - 'dryclean_explainer_assets.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install portable Gemini and video tools
        run: python -m pip install --disable-pip-version-check "google-genai>=1,<3" requests imageio-ffmpeg
      - name: Generate Charon speech per sentence and real-motion video assets
        run: python -u dryclean_explainer_assets.py
      - name: Archive previews and per-scene voice for manual editing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dryclean-explainer-assets
          path: |
            dry_cleaning_assets/scene_*.wav
            dry_cleaning_assets/clip_*.mp4
            dry_cleaning_assets/manifest.json
            dry_cleaning_assets/sources.txt
          if-no-files-found: warn
          retention-days: 14
