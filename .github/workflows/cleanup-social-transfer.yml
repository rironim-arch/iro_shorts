name: Clean up temporary social transfer video hosts
on:
  push:
    paths:
      - '.github/workflows/cleanup-social-transfer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove final temporary release after vidIQ import
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "missing-shorts-cfr30-transfer-20261121" -y --cleanup-tag --repo "${{ github.repository }}"
          echo "Temporary public media hosts removed"
