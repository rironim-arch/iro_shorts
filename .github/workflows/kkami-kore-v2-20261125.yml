name: Kkami Kore 1.25 v2 bounded 10 scenes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kkami-kore-v2-20261125.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q 'google-genai>=1,<3'
      - name: Gemini Kore fixed speed 1.25 generation bounded calls
        run: python -u kkami_kore_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kkami-kore-v2-audio
          path: |
            kkami_kore_v2/clip_*.wav
            kkami_kore_v2/full.wav
            kkami_kore_v2/manifest.json
          retention-days: 7
