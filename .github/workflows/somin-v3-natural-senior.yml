name: Somin V3 20+ Years Kore Natural Speed Anime
on:
  push:
    paths:
      - '.github/workflows/somin-v3-natural-senior.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  voice:
    name: Narrate updated 20-plus year Somin drama in Kore at natural speed
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-nanum
      - run: python -m pip install "google-genai>=1,<3" "faster-whisper>=1.0,<2" "Pillow>=10,<13"
      - name: Verify longform now says more than 20 years and Kore is natural speed
        run: |
          python - <<'PY'
          import json,pathlib
          story=json.loads(pathlib.Path('somin_longform_story_2026.json').read_text())
          script=' '.join(c['text'] for c in story['chapters'])
          assert '20년' in script
          assert '열네 해' not in script and '14년' not in script
          src=pathlib.Path('somin_v3_audio.py').read_text()
          assert 'SPEED=1.0' in src and 'atempo=1.25' not in src
          print('STORY_AND_PLAYBACK_VERIFIED',story['title'])
          PY
      - name: Produce Kore 1.0x narration with word-timed large Korean captions
        run: python -u somin_v3_audio.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somin-v3-kore-1x-voice-subtitles
          path: |
            somin_v3_audio_output/somin_narration.wav
            somin_v3_audio_output/somin_v3.ass
            somin_v3_audio_output/somin_v3.srt
            somin_v3_audio_output/somin_v3_kore_normal.mp3
            somin_v3_audio_output/somin_v3_speech_alignment_QA.json
          retention-days: 14
          if-no-files-found: warn
  film:
    needs: [voice]
    name: Cut existing 48 cinematic illustrations to natural speed narration
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-nanum
      - name: Get approved 48 original scene illustrations from successful V2 art job
        uses: actions/download-artifact@v4
        with:
          name: somin-v2-story-illustrations
          run-id: 43700225492
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: somin_v2_art
      - name: Get corrected 20-plus-year Kore natural-speed voice and subtitles
        uses: actions/download-artifact@v4
        with:
          name: somin-v3-kore-1x-voice-subtitles
          path: somin_v3_audio_output
      - name: Produce final anime MP4 with 72px synchronized subtitles
        run: python -u somin_v3_renderer.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somin-v3-20years-natural-kore-anime-mp4
          path: |
            somin_v3_release/*.mp4
            somin_v3_release/*.srt
            somin_v3_release/*.mp3
            somin_v3_release/*.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
