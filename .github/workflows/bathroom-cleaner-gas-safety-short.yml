name: 생활알고리즘 화장실 세제 유독가스 반전 - 풀스크린 실사 숏츠
on:
  push:
    paths:
      - '.github/workflows/bathroom-cleaner-gas-safety-short.yml'
      - 'make_bathroom_cleaner_safety_short.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video, image and verified-speech dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check "google-genai>=1,<3" "Pillow>=10,<13" "numpy>=1.26,<3" "requests>=2.31,<3" "imageio-ffmpeg>=0.5,<1"
          python -m py_compile make_bathroom_cleaner_safety_short.py
      - name: Check available Gemini secret
        run: test -n "$GEMINI_API_KEY" || (echo "::error::GEMINI_API_KEY absent" && exit 1)
      - name: Render real stock video with one continuous Charon voice and verify actual transcript
        run: python -u make_bathroom_cleaner_safety_short.py
      - name: Validate hook, factual sources, voice, duration and media
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('bathroom_cleaner_exports')
          voice=json.loads((root/'bathroom_voice_QA.json').read_text(encoding='utf-8'))
          info=json.loads((root/'bathroom_metadata.json').read_text(encoding='utf-8'))
          script=(root/'bathroom_script.txt').read_text(encoding='utf-8')
          assert voice['single_take'] and voice['cta_subscribe_count']==voice['cta_like_count']==1
          assert voice['similarity']>=0.82 and voice['speed']==1.25
          assert info['real_clips_count']>=3 and info['real_photos_count']>=4
          assert info['body_cta_count']==0 and info['final_cta_count']==1
          assert script.count('구독')==script.count('좋아요')==1
          assert not any(q in '\n'.join(script.splitlines()[:3]) for q in ('락스', '염소가스', '섞으면'))
          assert info['caption_chunks']>=16
          assert 'full height footage' in info['screen']
          assert 35<=info['duration_seconds']<=75, info['duration_seconds']
          assert (root/'bathroom_cleaners_toxic_gas_safety.mp4').stat().st_size>750000
          print('PASSED',info['duration_seconds'],'seconds, single Charon voice, 1 CTA, authentic media')
          PY
      - name: Preserve MP4, sources, subtitles, and independent transcript for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 생활알고리즘-화장실청소-유독가스-실사숏츠
          retention-days: 14
          if-no-files-found: warn
          path: |
            bathroom_cleaner_exports/bathroom_cleaners_toxic_gas_safety.mp4
            bathroom_cleaner_exports/bathroom_captions.srt
            bathroom_cleaner_exports/bathroom_script.txt
            bathroom_cleaner_exports/bathroom_voice_QA.json
            bathroom_cleaner_exports/bathroom_sources.txt
            bathroom_cleaner_exports/bathroom_metadata.json
      - name: Upload verified video to GitHub release, no YouTube or Instagram publishing
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lifealgorithm-bathroom-cleaner-gas-2026-11-20"
          movie="bathroom_cleaner_exports/bathroom_cleaners_toxic_gas_safety.mp4"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$movie" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$movie" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "생활알고리즘 - 화장실 청소하다 기침? 락스 세제 혼합 위험" \
              --notes "CDC 2024/2026 공식 청소세제 안전지침 기준, Pexels 실제 화장실 청소 영상. 화면을 거의 전체에 채우고 대사를 여러 짧은 자막으로 나눠 표시. 연속 Charon TTS 1.25배속, 독립 음성 받아쓰기 QA, 마지막 구독 좋아요 한 번. 아직 SNS 게시하지 않음." \
              --latest=false
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/bathroom_cleaners_toxic_gas_safety.mp4" >> "$GITHUB_STEP_SUMMARY"
