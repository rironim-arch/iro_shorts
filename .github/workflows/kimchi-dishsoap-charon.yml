name: Kimchi stain Shorts - Gemini Charon narration
on:
  push:
    paths:
      - '.github/workflows/kimchi-dishsoap-charon.yml'
      - 'kimchi_dishsoap_gemini_voice.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech SDK and ensure ffmpeg
        run: |
          python -m pip install --disable-pip-version-check "google-genai>=1,<3"
          ffmpeg -version | head -1
      - name: Generate Gemini Charon voice at 1.25x
        run: python -u kimchi_dishsoap_gemini_voice.py
      - name: Save voice for manual video merge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimchi-charon-voice
          path: kimchi_gemini_audio/
          if-no-files-found: warn
          retention-days: 14
