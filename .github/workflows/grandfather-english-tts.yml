name: Gemini 73yo grandfather English lessons voices
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/grandfather-english-tts.yml'
permissions:
  contents: read
jobs:
  synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TTS and QC dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2' 'numpy>=1.24,<3'
      - name: Generate Korean/English Gemini TTS with complete last syllables and recognize dialogue
        run: python -u grandfather_english_tts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grandfather-english-28-lines-gemini
          path: |
            grandfather_english_audio/turn_*.wav
            grandfather_english_audio/manifest.json
          if-no-files-found: warn
          retention-days: 7