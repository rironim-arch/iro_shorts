name: Kkami corrected Gemini Kore with ffmpeg
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kkami-ffmpeg-20261124.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and Gemini libraries
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Generate Kkami narration
        run: python -u kkami_story_gemini_20261124.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kkami-gemini-kore-ffmpeg
          path: |
            kkami_gemini/clip_*.wav
            kkami_gemini/full.wav
            kkami_gemini/manifest.json
          retention-days: 7
