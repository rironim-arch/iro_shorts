name: Minho naturally paced Gemini documentary TTS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/minho-natural-voice.yml'
permissions:
  contents: read
jobs:
  naturalvoice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini, ffmpeg, and Korean transcription
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Generate consistent long-form paragraphs with natural pace and ASR QA
        run: python -u minho_natural_gemini.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minho-natural-gemini-9-paragraphs
          path: |
            minho_natural_audio/clip_*.wav
            minho_natural_audio/manifest.json
          if-no-files-found: warn
          retention-days: 7