name: Father diary Gemini without apt
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dad-diary-quick-20261124.yml'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fast Gemini only
        run: python -m pip install -q 'google-genai>=1,<3'
      - name: Record four updated diary lines
        run: python -u dad_diary_quick_20261124.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: father-diary-quick-retakes
          path: dad_diary_quick/
          retention-days: 7
