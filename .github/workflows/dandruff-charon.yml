name: 생활알고리즘 비듬 Charon 6장면 음성
on:
  push:
    paths:
      - '.github/workflows/dandruff-charon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "google-genai>=1,<2"
      - name: Generate original Charon narration without voice substitution
        run: python dandruff_charon_tts.py
      - name: Save review-only voice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dandruff-charon-six-scenes
          path: out_dandruff_charon/*
          retention-days: 14
          if-no-files-found: warn
