name: Gemini Minho retake line 11
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/minho-line11.yml'
permissions:
  contents: read
jobs:
  retake:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare voice and transcription dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Fix a single missing Gemini voice line with strict ASR check
        run: python -u minho_line11.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minho-line11-Orus-corrected
          path: minho_single_fix/turn_11.wav
          if-no-files-found: warn
          retention-days: 7