name: Father remarriage Kore closing CTA repair
on:
  push:
    paths:
      - '.github/workflows/father-remarriage-cta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "google-genai>=1,<3"
      - run: python -u father_remarriage_cta.py
      - uses: actions/upload-artifact@v4
        with:
          name: father-remarriage-kore-cta
          path: father_remarriage_cta/*.wav
          retention-days: 7