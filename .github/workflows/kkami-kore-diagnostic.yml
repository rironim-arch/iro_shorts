name: Kkami Kore single audio diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kkami-kore-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q 'google-genai>=1,<3'
      - run: python -u kkami_kore_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kkami-kore-diagnostic
          path: kkami_kore_probe/
