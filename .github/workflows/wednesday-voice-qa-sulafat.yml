name: Wednesday Warm Female Sulafat Voice Second-Sample QA
on:
  push:
    paths:
      - '.github/workflows/wednesday-voice-qa-sulafat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "google-genai>=1,<3"
      - name: Exactly one voice-generation request, no quota retries
        run: python -u wednesday_voice_sulafat_qa.py
      - name: Upload voice sample only for approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wednesday-warm-sulafat-pro-voice-sample-only
          path: |
            wednesday_voice_sulafat_qa/*.mp3
            wednesday_voice_sulafat_qa/*.wav
            wednesday_voice_sulafat_qa/*.txt
          if-no-files-found: warn
          retention-days: 7
