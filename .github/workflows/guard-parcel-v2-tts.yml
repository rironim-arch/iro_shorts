name: Guard Parcel Corrected Ending Orus v2
on:
  push:
    paths:
      - 'guard_parcel_v2_tts.py'
      - '.github/workflows/guard-parcel-v2-tts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "google-genai>=1,<3" imageio-ffmpeg
      - name: Generate corrected one-take Korean Orus narration
        run: python -u guard_parcel_v2_tts.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-parcel-orus-corrected-ending
          path: guard_parcel_revised_audio/
          retention-days: 7
          if-no-files-found: warn
