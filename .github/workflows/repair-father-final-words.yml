name: Fix clipped father decision sentence and verify whole ending
on:
  push:
    paths:
      - '.github/workflows/repair-father-final-words.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Record uncut father line and verify the last word
        run: python -u repair_father_decision_full.py
      - name: Archive full repair candidate and speech recognition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: father-decision-complete-enceladus
          path: |
            father_full_lastline_repair/father_important_complete.wav
            father_full_lastline_repair/qa.json
          retention-days: 7
          if-no-files-found: warn