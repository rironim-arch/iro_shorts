name: Salary 15 years Gemini TTS and timed captions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/salary15-gemini-tts-20261124.yml'
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Gemini 1.25x dialogue and word aligned ASR
        run: python -u salary15_gemini_tts_20261124.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salary15-gemini-voice-and-wordtiming
          path: |
            salary15_gemini/clip_*.wav
            salary15_gemini/full.wav
            salary15_gemini/manifest.json
          retention-days: 7
