name: Electric swatter REAL photos and ONE continuous Charon voice
on:
  push:
    paths:
      - '.github/workflows/electric-swatter-real-single-voice.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal video rendering and speech dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check "google-genai>=1,<3" "Pillow>=10,<13" "requests>=2.31,<3" "imageio-ffmpeg>=0.5,<1"
          python -m py_compile create_electric_swatter_REAL_SINGLE_VOICE.py
      - name: Verify Gemini API connection
        run: test -n "$GEMINI_API_KEY" || (echo "::error::Gemini API key not configured" && exit 1)
      - name: Render new video: authentic photographs, motion and single voice
        run: python -u create_electric_swatter_REAL_SINGLE_VOICE.py
      - name: Confirm that video has one uninterrupted voice and final-only CTA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('electric_swatter_real_retake')
          a=json.loads((root/'qa.json').read_text(encoding='utf-8'))
          v=json.loads((root/'actual_audio_qa.json').read_text(encoding='utf-8'))
          assert a['voice_single_take'] and v['single_continuous_take']
          assert a['electric_swatter_photos']>0 and a['mosquito_photos']>0
          assert v['spoken_subscribe_count']==v['spoken_like_count']==1
          assert a['cta_in_body_written']==0 and a['cta_in_final_written']==1
          assert (root/'electric_swatter_REAL_SINGLE_VOICE.mp4').stat().st_size>600000
          print('PASSED: genuine photos and one uninterrupted Korean male voice, CTA once')
          PY
      - name: Upload draft video and detailed QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electric-swatter-real-single-voice-review
          path: |
            electric_swatter_real_retake/electric_swatter_REAL_SINGLE_VOICE.mp4
            electric_swatter_real_retake/captions.srt
            electric_swatter_real_retake/script.txt
            electric_swatter_real_retake/sources.txt
            electric_swatter_real_retake/qa.json
            electric_swatter_real_retake/actual_audio_qa.json
          if-no-files-found: warn
          retention-days: 14
      - name: Release mobile MP4 through direct GitHub link
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="electric-swatter-real-one-voice-2026-11-12"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" electric_swatter_real_retake/electric_swatter_REAL_SINGLE_VOICE.mp4 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" electric_swatter_real_retake/electric_swatter_REAL_SINGLE_VOICE.mp4 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "전기 모기채 - 실사와 한 목소리로 새로 만든 생활알고리즘 숏츠" \
              --notes "기존 그림 기반 영상 사용 안 함. 실제 라이선스 사진에 카메라 확대/이동 효과, 실사 벌레 영상 확보 시 함께 사용. Gemini Charon 1회 연속 녹음, 1.25배속, 실제 받아쓰기 검증 후 마지막 CTA 1회. 유튜브 자동 업로드 없음." \
              --latest=false
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/electric_swatter_REAL_SINGLE_VOICE.mp4" >> "$GITHUB_STEP_SUMMARY"
