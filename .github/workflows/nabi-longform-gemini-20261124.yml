name: Nabi longform Gemini TTS and word alignment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nabi-longform-gemini-20261124.yml'
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m pip install --disable-pip-version-check -q 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
          python -m py_compile nabi_longform_gemini_20261124.py
      - name: Gemini roles and actual word timing
        run: |
          test -n "$GEMINI_API_KEY"
          python -u nabi_longform_gemini_20261124.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nabi-longform-gemini-audio
          path: |
            nabi_longform_audio/clip_*.wav
            nabi_longform_audio/full.wav
            nabi_longform_audio/manifest.json
          retention-days: 7
