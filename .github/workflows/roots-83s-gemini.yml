name: Gemini photo story invisible roots voices
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/roots-83s-gemini.yml'
permissions:
  contents: read
jobs:
  synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech processing tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2' 'numpy>=1.24,<3'
      - name: Create and ASR-check all complete original Korean story voice clips
        run: python -u roots_83s_gemini.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roots-photo-story-gemini-25lines
          path: |
            roots_tts_audio/turn_*.wav
            roots_tts_audio/manifest.json
          if-no-files-found: warn
          retention-days: 7