name: Kkami Kore TTS resilient scene batches
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kkami-kore-batches.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch: [0, 1, 2, 3, 4]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q 'google-genai>=1,<3'
      - name: Render two Kore narration clips
        run: python -u kkami_kore_parallel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kkami-kore-batch-${{ matrix.batch }}
          path: |
            kkami_parallel_${{ matrix.batch }}/clip_*.wav
            kkami_parallel_${{ matrix.batch }}/manifest.json
          retention-days: 7
