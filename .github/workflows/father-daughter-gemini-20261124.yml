name: Father daughter homework Gemini TTS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/father-daughter-gemini-20261124.yml'
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Gemini voice and exact word timestamps QA
        run: python -u father_daughter_gemini_20261124.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: father-daughter-gemini-tts-20261124
          path: |
            dad_daughter_gemini/clip_*.wav
            dad_daughter_gemini/full.wav
            dad_daughter_gemini/manifest.json
          retention-days: 7
