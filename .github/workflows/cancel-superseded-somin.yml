name: Cancel superseded Somin draft build
on:
  push:
    paths:
      - '.github/workflows/cancel-superseded-somin.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel_old:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel outdated pre-correction Somin generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/43695021812/cancel"
