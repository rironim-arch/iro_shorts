name: Cancel obsolete Somin 1.25x jobs
on:
  push:
    paths:
      - '.github/workflows/cancel-superseded-somin.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel_old:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only superseded 1.25x narration jobs, preserve newest 1.0x production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN_ID in 43712561094; do
            echo "Cancel obsolete Somin run ${RUN_ID}"
            curl --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" || true
          done
