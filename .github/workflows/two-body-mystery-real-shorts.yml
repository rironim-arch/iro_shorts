name: 생활알고리즘 궁금증 유발 신체 미스터리 숏츠 2편
on:
  push:
    paths:
      - '.github/workflows/two-body-mystery-real-shorts.yml'
      - 'make_two_body_mystery_shorts.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check "google-genai>=1,<3" "Pillow>=10,<13" "numpy>=1.26,<3" "requests>=2.31,<3" "imageio-ffmpeg>=0.5,<1"
          python -m py_compile make_two_body_mystery_shorts.py
      - name: Confirm secret
        run: test -n "$GEMINI_API_KEY" || (echo "::error::No Gemini API key" && exit 1)
      - name: Produce suspense-first live-footage Shorts with single Charon voice per video
        run: python -u make_two_body_mystery_shorts.py
      - name: Strict QA before publication
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('body_mysteries_shorts')
          for key,name in [('sleep','sleep_falling_sensation_hypnic_jerk.mp4'),('eyes','black_dots_in_vision_eye_floaters.mp4')]:
              q=json.loads((p/f'{key}_voice_QA.json').read_text(encoding='utf-8'))
              m=json.loads((p/f'{key}_metadata.json').read_text(encoding='utf-8'))
              assert q['single_take'] and q['cta_subscribe_count']==q['cta_like_count']==1
              assert q['similarity']>=.82
              assert m['real_clips_count']>=1 and m['real_photos_count']>=1
              assert m['body_cta_count']==0 and m['final_cta_count']==1
              assert (p/name).stat().st_size>600000
              script=(p/f'{key}_script.txt').read_text(encoding='utf-8')
              firstthree=''.join(script.splitlines()[:3])
              assert '입면 경련' not in firstthree and '비문증' not in firstthree
              print('PASSED',key,'length',m['duration_seconds'],'file',name)
          PY
      - name: Save both videos, subtitle drafts, actual speech QA and source links
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleep-eye-mysteries-review
          retention-days: 14
          if-no-files-found: warn
          path: |
            body_mysteries_shorts/sleep_falling_sensation_hypnic_jerk.mp4
            body_mysteries_shorts/black_dots_in_vision_eye_floaters.mp4
            body_mysteries_shorts/sleep_captions.srt
            body_mysteries_shorts/eyes_captions.srt
            body_mysteries_shorts/sleep_script.txt
            body_mysteries_shorts/eyes_script.txt
            body_mysteries_shorts/sleep_voice_QA.json
            body_mysteries_shorts/eyes_voice_QA.json
            body_mysteries_shorts/sleep_sources.txt
            body_mysteries_shorts/eyes_sources.txt
            body_mysteries_shorts/sleep_metadata.json
            body_mysteries_shorts/eyes_metadata.json
      - name: Publish direct-download MP4 assets on GitHub for Android
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="body-mystery-sleep-eyes-real-shorts-2026-11-17"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" body_mysteries_shorts/sleep_falling_sensation_hypnic_jerk.mp4 body_mysteries_shorts/black_dots_in_vision_eye_floaters.mp4 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" body_mysteries_shorts/sleep_falling_sensation_hypnic_jerk.mp4 body_mysteries_shorts/black_dots_in_vision_eye_floaters.mp4 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "생활알고리즘 - 잠들다 떨어지는 느낌 & 눈앞 검은 점 미스터리" \
              --notes "원인 공개 전까지 궁금증 유발, 4번째 장면에 정체 설명. Cleveland Clinic / 미국 NEI / NHS 공식 자료. 저작권 문제 없는 실제 Pexels 동영상과 사진. 40~60초, 큰 한국어 자막, 영상마다 Gemini Charon 1회 연속 녹음(1.25배속). 실제 음성 받아쓰기에서 마지막 구독 좋아요 딱 한번 확인. 사용자가 검토하기 위한 공개 다운로드이고 인스타/유튜브 자동 게시 없음." \
              --latest=false
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/sleep_falling_sensation_hypnic_jerk.mp4" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/black_dots_in_vision_eye_floaters.mp4" >> "$GITHUB_STEP_SUMMARY"
