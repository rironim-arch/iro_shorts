name: Publish redesigned coffee grounds Short
on:
  push:
    paths:
      - .github/workflows/coffee-grounds-redesign-release.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  redesign:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install portable FFmpeg and Korean font via Python packages
        run: |
          python -m pip install "Pillow>=10,<13" "imageio-ffmpeg>=0.5,<1" "koreanize-matplotlib>=0.1,<1"
          python - <<'PY'
          import imageio_ffmpeg, pathlib, koreanize_matplotlib
          binary=pathlib.Path(imageio_ffmpeg.get_ffmpeg_exe())
          target=pathlib.Path.home()/'.local/bin'
          target.mkdir(parents=True,exist_ok=True)
          (target/'ffmpeg').symlink_to(binary)
          fonts=list(pathlib.Path(koreanize_matplotlib.__file__).parent.rglob('NanumGothic.ttf'))
          if not fonts:
              fonts=list(pathlib.Path(koreanize_matplotlib.__file__).parent.rglob('*.ttf'))
          if not fonts:raise RuntimeError("No Korean TTF font found")
          out=pathlib.Path.home()/'noto'
          out.mkdir(exist_ok=True)
          (out/'NotoSansCJK-Bold.ttc').symlink_to(fonts[0])
          (out/'NotoSansCJK-Regular.ttc').symlink_to(fonts[0])
          print("FFmpeg:",binary,"Font:",fonts[0])
          PY
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo mkdir -p /usr/share/fonts/opentype/noto
          sudo ln -sf "$HOME/noto/NotoSansCJK-Bold.ttc" /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
          sudo ln -sf "$HOME/noto/NotoSansCJK-Regular.ttc" /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - name: Download original Charon Short with caption timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 43022952084 --repo "$GITHUB_REPOSITORY" \
            --name coffee-grounds-charon-short-review --dir "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/coffee_grounds_review_short.mp4"
          test -s "$RUNNER_TEMP/source/captions.srt"
      - name: Write editorial redesign script
        run: |
          cat > "$RUNNER_TEMP/write_script.py" <<'PY'
          import base64,gzip, pathlib
          blob=''
          pathlib.Path('redesign_coffee.py').write_bytes(gzip.decompress(base64.b64decode(blob)))
          PY
          cd "$RUNNER_TEMP"
          python3 write_script.py
      - name: Render shorter visuals, cream background and bottom explanations
        run: |
          cd "$RUNNER_TEMP"
          python3 redesign_coffee.py \
            --source "$RUNNER_TEMP/source/coffee_grounds_review_short.mp4" \
            --captions "$RUNNER_TEMP/source/captions.srt" \
            --output "$RUNNER_TEMP/coffee_grounds_redesigned_mobile.mp4" \
            --work "$RUNNER_TEMP/render"
          test -s "$RUNNER_TEMP/coffee_grounds_redesigned_mobile.mp4"
      - name: Publish MP4 for direct Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="coffee-grounds-redesign-2026-11-12"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/coffee_grounds_redesigned_mobile.mp4" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$RUNNER_TEMP/coffee_grounds_redesigned_mobile.mp4" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "생활알고리즘 커피 찌꺼기 활용 - 새 레이아웃" \
              --notes "배경 크림/커피색, 중앙 실사 프레임 축소, 하단 설명, Charon 음성 유지. 게시 전 검토용." --latest=false
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/coffee_grounds_redesigned_mobile.mp4" >> "$GITHUB_STEP_SUMMARY"
