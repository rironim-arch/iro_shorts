name: Restaurant memories - Orus male TTS
on:
  push:
    paths:
      - '.github/workflows/restaurant-orus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "google-genai>=1,<3"
      - name: Generate single natural middle-aged male voice
        run: python -u restaurant_orus_2026.py
      - name: Save generated voice and script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-orus-male-120
          path: |
            restaurant_orus_output/*.wav
            restaurant_orus_output/*.mp3
            restaurant_orus_output/*.json
          retention-days: 7
          if-no-files-found: warn
