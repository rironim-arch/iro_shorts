name: Quiet Support - Orus Male Story TTS
on:
  push:
    paths:
      - '.github/workflows/quiet-support-orus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "google-genai>=1,<3"
      - name: Generate Orus 1.2x male story voice
        run: python -u quiet_support_orus_2026.py
      - name: Save voice artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiet-support-orus-120
          path: |
            quiet_support_orus_output/*.wav
            quiet_support_orus_output/*.mp3
            quiet_support_orus_output/*.json
          retention-days: 7
          if-no-files-found: warn
