name: Minho loneliness gatherings Gemini photo shorts TTS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/minho-gatherings-tts.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini TTS audio and transcription packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Generate complete natural voice lines and automated check
        run: python -u minho_gatherings_tts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minho-gatherings-Kore-Orus-Puck
          path: |
            minho_gemini_audio/turn_*.wav
            minho_gemini_audio/manifest.json
          if-no-files-found: warn
          retention-days: 7