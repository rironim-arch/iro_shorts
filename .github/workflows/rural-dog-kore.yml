name: Rural dog tribute - Korean Kore TTS
on:
  push:
    paths:
      - '.github/workflows/rural-dog-kore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "google-genai>=1,<3"
      - name: Narrate story with Gemini Kore female voice
        run: python -u rural_dog_kore_2026.py
      - name: Save Korean Kore TTS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rural-dog-kore-female-125
          path: |
            rural_dog_kore_output/*.wav
            rural_dog_kore_output/*.mp3
            rural_dog_kore_output/*.json
          retention-days: 7
          if-no-files-found: warn
