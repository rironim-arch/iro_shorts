name: Re-align two wolves shorts audio with transcription
on:
  push:
    paths:
      - '.github/workflows/wolf-asr-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup ffmpeg and faster whisper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          python -m pip install -q "faster-whisper>=1,<2"
      - name: Analyze wolf short actual voice
        run: python -u wolf_asr_20261119.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wolf-asr-exact-times
          path: wolf_asr_74sec.json
          retention-days: 5
          if-no-files-found: warn
