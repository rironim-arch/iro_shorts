name: Gemini roots father concise pronunciation retake
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/roots-father-retake.yml'
permissions:
  contents: read
jobs:
  retake:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Re-synthesize elderly father scripts only and reject any extra words
        run: python -u roots_father_retake.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roots-father-9-corrected-lines
          path: |
            roots_tts_retake/turn_*.wav
            roots_tts_retake/retake_manifest.json
          retention-days: 7