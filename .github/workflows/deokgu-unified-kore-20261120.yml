name: Deokgu Unified Single-Take Kore Voice
on:
  push:
    paths:
      - 'deokgu_unified_kore_20261120.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified_voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "google-genai>=1,<3"
      - run: python -u deokgu_unified_kore_20261120.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deokgu-unified-kore-voice
          path: deokgu_unified_output/
          retention-days: 10
          if-no-files-found: warn
