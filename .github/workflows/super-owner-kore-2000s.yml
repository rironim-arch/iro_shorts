name: Insaeng Anime - 2000s Super Owner Gemini Kore One Voice
on:
  push:
    paths:
      - '.github/workflows/super-owner-kore-2000s.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Gemini
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "google-genai>=1,<3"
      - name: Generate entire story as one uninterrupted Gemini Kore voice
        run: python -u super_owner_kore_2000s_20261121.py
      - name: Save WAV, MP3 and exact script for caption sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-owner-kore-single-voice
          path: |
            super_owner_kore_output/gemini_kore_one_take.wav
            super_owner_kore_output/gemini_kore_one_take.mp3
            super_owner_kore_output/script.json
            super_owner_kore_output/voice_info.json
          retention-days: 7
          if-no-files-found: warn
