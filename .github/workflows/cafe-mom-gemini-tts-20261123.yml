name: Cafe Mom Gemini TTS video source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cafe-mom-gemini-tts-20261123.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TTS and Korean speech validation tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Create Gemini TTS with Kore Orus Algenib and verify each line
        run: python -u cafe_mom_gemini_tts_20261123.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cafe-mom-gemini-tts-20261123
          path: |
            cafe_mom_gemini_tts/line_*.wav
            cafe_mom_gemini_tts/full.mp3
            cafe_mom_gemini_tts/captions.srt
            cafe_mom_gemini_tts/manifest.json
          retention-days: 7
