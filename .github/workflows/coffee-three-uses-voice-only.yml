name: coffee three uses - Gemini voice only fallback
on:
  push:
    paths:
      - '.github/workflows/coffee-three-uses-voice-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal Gemini SDK only
        run: python -m pip install --disable-pip-version-check "google-genai>=1,<3"
      - name: Generate new narration on each scene
        run: python -u create_coffee_voice_only.py
      - name: Upload all scene audio and caption manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coffee-three-uses-charon-voice
          path: coffee_three_uses_voice/
          retention-days: 14
          if-no-files-found: warn
