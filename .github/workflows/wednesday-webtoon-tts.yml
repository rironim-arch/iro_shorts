name: Wednesday Night Webtoon Kore and Orus
on:
  push:
    paths:
      - 'wednesday_webtoon_tts.py'
      - '.github/workflows/wednesday-webtoon-tts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "google-genai>=1,<3" imageio-ffmpeg
      - run: python -u wednesday_webtoon_tts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wednesday-webtoon-voices
          path: wednesday_story_voice/
          retention-days: 7
          if-no-files-found: warn
