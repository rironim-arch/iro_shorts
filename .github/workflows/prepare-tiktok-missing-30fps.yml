name: Prepare 4 missing TikTok clips as constant 30fps
on:
  push:
    paths:
      - '.github/workflows/prepare-tiktok-missing-30fps.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reencode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install ffmpeg
        run: python -m pip install -q --disable-pip-version-check imageio-ffmpeg
      - name: Reencode four public Shorts
        run: |
          python - <<'PY'
          import json,os,subprocess,urllib.request,imageio_ffmpeg
          urls=json.loads(r'''{"funeral":"https://storage.googleapis.com/vidiq-user-videos/e12c8422-2c00-4502-b8d1-ce48b534a1a2/f230b3bc-9dbb-4e0e-bf17-d3210da01ace.mp4?GoogleAccessId=ai-proxy-20261001%40studious-pen-429.vid.io.iam.gserviceaccount.com&Expires=1795844299&Signature=SSH%2FEWi2fpOGYe6jJGpRa2t3HWgvzQAjig96n6oybFxce9pQ5CaFtNzUL65BZWt6OM5qpaqQ3ZhPT6b1b4oFYseWvfqt8yl89b8XjnS2StiQiLuqiO8bGVVfapdrxSuC%2BwD55QKQ2YEMqH%2BROkSW7%2FeTADUecUtOLpsR06oNJkq4FcGyZMAWZcVgSPluZLBMPFElcP7%2FWCMQHKgIX25n0ACeiGVs0JavSGVb5HJrzmtJchdRkD0gCf2%2B%2FoEzGR1VhnUI4XCaPayOrlkMUmGLUJoDuVMVsACA1dNs2STxgQ3B%2BN4Qwmdv4IJSZH5La1diDWg4JN2Cb4iqOLFfOoTFoQ%3D%3D","indian":"https://storage.googleapis.com/vidiq-user-videos/e12c8422-2c00-4502-b8d1-ce48b534a1a2/c957243c-bd36-4f4e-b805-018852f20b86.mp4?GoogleAccessId=ai-proxy-20261001%40studious-pen-429.vid.io.iam.gserviceaccount.com&Expires=1795844301&Signature=hxViPvqU6AYEylvNhecIo7zPr7aoriafFNaSg7TIsfDytyyybM8M2VJxwGcePPr9QwymKXrJJ%2FohjRnsTPcOKVQtrd2CoAHEsGFRtmfKVte88UdKP69JE08vP1Cjp4o6Mhb9dvtcasDb8pcmNT986F%2B52Tzbp5IgF17qWFI0bF65LTQf%2FLcJlx8iPnqSJW6QiW9QiFP%2Fx8br7Q%2BUKyifXpXxu%2B%2FZyzkqs4O0iwWG5hJnAsFt4MdrUewWNp%2BqBFI5li%2BdOKNUNTA9erAewjRlm6%2Fdpny3DOBrvtdNFIInWk0qIF5eCgHGZ9of4eZ0zH9CqlzslddJ1R54POxRYPJnPA%3D%3D","motherangry":"https://storage.googleapis.com/vidiq-user-videos/e12c8422-2c00-4502-b8d1-ce48b534a1a2/c49eb678-c174-4299-917b-816a90e2235b.mp4?GoogleAccessId=ai-proxy-20261001%40studious-pen-429.vid.io.iam.gserviceaccount.com&Expires=1795844302&Signature=n%2BrkT6OdQp2sg5VkTHHJ9NGbHMU6SbV4HsP2OQ%2FYiEuIPuu3ajgNarhQkErdQe1bMueBtWIxWW4oIkbkjnIAjrrLdmnQ4PEZyMWnEVhmKSP2aj%2FI4XZy45amz2ErTD1FPPok5VxXVM01eAz4QN%2BrvWMKn1epFJwikV4WSmhKn%2BFxaY14Lvy0ck49JaqzcBErV79Gw2pmsvv684cFuzyfbmrPd7k3eTVLcI6Wvai0LW4lIbECX8YRetbtckwuOL8U5a1rhXpgb3PBEeWIYQeUz9dW%2FItwXQRIqTWJ6x2eisdSHTS3RZPsAtznIE3NHiu5%2FpHU%2BY0AysDjyHYl%2FQgDqA%3D%3D","oldman":"https://storage.googleapis.com/vidiq-user-videos/e12c8422-2c00-4502-b8d1-ce48b534a1a2/43f83ce7-dfb6-4f