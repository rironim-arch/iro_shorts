          ff=imageio_ffmpeg.get_ffmpeg_exe()
          os.makedirs("outputs",exist_ok=True)
          for name,url in urls.items():
            src=f"{name}_src.mp4"
            print("START",name,flush=True)
            urllib.request.urlretrieve(url,src)
            dst=f"outputs/{name}_30fps.mp4"
            subprocess.run([ff,"-hide_banner","-loglevel","error","-y",
              "-i",src,"-vf","fps=30,scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2",
              "-r","30","-fps_mode","cfr","-c:v","libx264","-preset","ultrafast","-crf","23",
              "-pix_fmt","yuv420p","-video_track_timescale","30000","-c:a","aac","-b:a","128k",
              "-ar","48000","-movflags","+faststart",dst],check=True)
            print("FINISHED",name,os.stat(dst).st_size,flush=True)
          PY
      - name: Publish temporary import URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "missing-shorts-cfr30-transfer-20261121" outputs/*.mp4 --repo "${{ github.repository }}" --target main --title "Temporary missing TikTok media" --notes "Temporary reencoded copies of already-public Shorts."
          gh release view "missing-shorts-cfr30-transfer-20261121" --repo "${{ github.repository }}" --json assets --jq '.assets[]|.name+" "+.url'
