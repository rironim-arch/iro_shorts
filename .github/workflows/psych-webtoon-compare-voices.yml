name: Two Webtoon Story Voices - Algenib and Orus
on:
  push:
    paths:
      - 'psych_webtoon_compare_voices.py'
      - '.github/workflows/psych-webtoon-compare-voices.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: pip install --disable-pip-version-check "google-genai>=1,<3" imageio-ffmpeg
      - name: Generate two narrated voice samples
        run: python -u psych_webtoon_compare_voices.py
      - name: Upload mp3 auditions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-story-two-voices
          path: voice_comparison_samples/
          if-no-files-found: warn
          retention-days: 14
