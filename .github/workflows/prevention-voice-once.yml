name: 승인된 탈모 예방 숏츠 음성 1회 제작
on:
  push:
    paths:
      - hair_prevention_voice.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Google SDK
        run: pip install "google-genai>=1.0.0,<3"
      - name: Make narration audio
        run: python make_prevention_voice.py
      - name: Upload WAV
        uses: actions/upload-artifact@v4
        with:
          name: approved-prevention-narration
          path: hair_prevention_voice.wav
          retention-days: 3
