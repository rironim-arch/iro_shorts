name: Gemini roots final diction checks
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/roots-final-diction.yml'
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up audio QA
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Generate final crisp old father audio
        run: python -u roots_final_diction.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roots-final-corrected-5-lines
          path: |
            roots_tts_final_retake/turn_*.wav
            roots_tts_final_retake/final_manifest.json
          if-no-files-found: warn
          retention-days: 7