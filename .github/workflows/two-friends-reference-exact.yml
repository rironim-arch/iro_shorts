name: Two Friends Exact Layout - Apply Approved Reference
on:
  workflow_dispatch:
    inputs:
      voice_run_id:
        description: "Existing completed Gemini Orus workflow run ID"
        required: true
        type: string
      reference_framepack_url:
        description: "Approved screenshot-accurate framepack HTTPS URL"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  apply-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VOICE_RUN_ID: ${{ inputs.voice_run_id }}
      REFERENCE_FRAMEPACK_URL: ${{ inputs.reference_framepack_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Rebuild from approved framepack and existing Orus audio
        run: python -u two_friends_layout_final_20261121.py
      - name: Private review only - no posting
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-friends-reference-exact-gemini-orus-final
          path: |
            two_friends_reference_final/인생애니사연_30년만에뒤바뀐두친구_Orus_30fps.mp4
            two_friends_reference_final/Gemini_Orus_원본.wav
            two_friends_reference_final/실제Gemini음성기준자막.srt
            two_friends_reference_final/qa.json
          retention-days: 7
          if-no-files-found: warn
