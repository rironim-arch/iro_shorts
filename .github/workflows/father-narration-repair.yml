name: Repair father remarriage cut narration with Gemini Kore
on:
  push:
    paths:
      - '.github/workflows/father-narration-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio generation and Korean ASR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "google-genai>=1,<3" "faster-whisper>=1.1,<2"
      - name: Re-record final badminton narration and verify every last word
        run: python -u father_narration_repair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: father-narration-fixed-kore
          path: |
            father_remarriage_narrator_repair/new_narration_kore.wav
            father_remarriage_narrator_repair/qa.json
          if-no-files-found: warn
          retention-days: 7