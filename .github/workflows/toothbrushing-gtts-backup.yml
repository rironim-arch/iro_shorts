name: Toothbrushing Korean voice fallback
on:
  push:
    paths:
      - '.github/workflows/toothbrushing-gtts-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "gTTS>=2.5,<3"
      - run: python toothbrushing_gtts_backup.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toothbrushing-korean-backup
          path: out_tooth_gtts/*.mp3
          if-no-files-found: warn
          retention-days: 14
