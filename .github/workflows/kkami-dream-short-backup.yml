name: Kkami short Kore dream backup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kkami-dream-short-backup.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q 'google-genai>=1,<3'
      - run: python -u kkami_kore_group6short.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kkami-kore-dream-6short
          path: |
            kkami_group6short/clip_06.wav
            kkami_group6short/manifest.json
          retention-days: 7
