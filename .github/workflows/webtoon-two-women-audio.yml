name: Original Two Women Webtoon - Narration
on:
  push:
    paths:
      - 'webtoon_two_women_audio.py'
      - '.github/workflows/webtoon-two-women-audio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "google-genai>=1,<3" imageio-ffmpeg
      - name: Render female dialogue tracks
        run: python -u webtoon_two_women_audio.py
      - name: Upload generated audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-two-women-final-audio
          path: webtoon_coworkers_audio/
          retention-days: 14
          if-no-files-found: warn
