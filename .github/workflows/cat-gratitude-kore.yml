name: Cat gratitude - Gemini Kore TTS
on:
  push:
    paths:
      - '.github/workflows/cat-gratitude-kore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup
        run: |
          python -m pip install "google-genai>=1,<3"
      - name: Generate Korean Kore voice
        run: python -u cat_gratitude_kore_2026.py
      - name: Save TTS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-gratitude-female-kore
          path: |
            cat_gratitude_kore_output/*.wav
            cat_gratitude_kore_output/*.mp3
            cat_gratitude_kore_output/*.json
          retention-days: 7
          if-no-files-found: warn
