name: Kkami Kore v2 timing after voice
on:
  workflow_run:
    workflows:
      - "Kkami Kore 1.25 v2 bounded 10 scenes"
    types:
      - completed
permissions:
  contents: read
  actions: read
jobs:
  align:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: kkami-kore-v2-audio
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source_voice
      - run: pip install -q 'openai>=2,<5'
      - run: python -u kkami_kore_v2_asr.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kkami-kore-v2-word-times
          path: kkami_kore_v2_word_times.json
