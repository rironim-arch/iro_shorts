name: QA every Kore segment for father dawn short
on:
  push:
    paths:
      - 'father_dawn_kore_qa_20261119.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q faster-whisper
      - name: Download original Kore audio
        run: gh api /repos/${{ github.repository }}/actions/artifacts/14540103114/zip > /tmp/father_dawn_voice.zip
      - name: Check every audio segment matches narration
        run: python -u father_dawn_kore_qa_20261119.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: father-dawn-kore-qa
          path: father_dawn_voice_qa.json
          retention-days: 5
          if-no-files-found: warn
