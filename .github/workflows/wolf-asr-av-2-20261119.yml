name: Two Wolves voice-to-caption alignment verified
on:
  push:
    paths:
      - '.github/workflows/wolf-asr-av-2-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q faster-whisper
      - run: python -u wolf_asr_av_20261119.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wolf-asr-verified-74s
          path: wolf_asr_74sec_av.json
          retention-days: 5
          if-no-files-found: warn
