name: Minho Gemini character retakes 20261123
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/minho-tts-retakes-20261123.yml
permissions:
  contents: read
jobs:
  rerender:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech validation software
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Re-record only unclear lines with original Gemini actor voices
        run: python -u minho_tts_retakes_20261123.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minho-gemini-line-retakes-20261123
          path: |
            minho_tts_retakes/line_*.wav
            minho_tts_retakes/manifest.json
          retention-days: 7
