name: Webtoon hero voice consistency - Kore
on:
  push:
    paths:
      - 'webtoon_heroine_kore_voice.py'
      - '.github/workflows/webtoon-heroine-kore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check "google-genai>=1,<3" imageio-ffmpeg
      - name: Produce ONLY heroine voice with Kore
        run: python -u webtoon_heroine_kore_voice.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-heroine-kore-voice
          path: webtoon_heroine_voice/
          retention-days: 14
          if-no-files-found: warn
