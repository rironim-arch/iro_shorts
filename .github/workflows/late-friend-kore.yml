name: Late Friend Gemini Kore Unified Voice
on:
  push:
    paths:
      - 'late_friend_kore_20261121.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "google-genai>=1,<3"
      - name: Render entire approved script with Kore
        run: python -u late_friend_kore_20261121.py
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: late-friend-kore-20261121
          path: late_friend_kore_output/
          retention-days: 8
          if-no-files-found: warn
