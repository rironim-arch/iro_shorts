name: Delete obsolete Somin longform artifacts
on:
  push:
    paths:
      - '.github/workflows/cleanup-somin-artifacts.yml'
permissions:
  actions: write
  contents: read
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only Somin generated artifacts from this repository
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GITHUB_TOKEN']
          base=f'https://api.github.com/repos/{repo}/actions/artifacts'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          removed=[]
          for page in range(1,10):
              req=urllib.request.Request(base+f'?per_page=100&page={page}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as f:
                  artifacts=json.load(f).get('artifacts',[])
              if not artifacts:break
              for a in artifacts:
                  if 'somin' not in a.get('name','').lower():continue
                  aid=a['id']
                  q=urllib.request.Request(f'{base}/{aid}',headers=headers,method='DELETE')
                  try:
                      with urllib.request.urlopen(q,timeout=30) as f: f.read()
                      removed.append(aid)
                      print('DELETED_SOMIN_ARTIFACT',aid,a['name'],flush=True)
                  except urllib.error.HTTPError as e:
                      print('DELETE_FAILED',aid,e.code,flush=True)
              if len(artifacts)<100:break
          print('SOMIN_ARTIFACTS_REMOVED',len(removed),flush=True)
          PY
