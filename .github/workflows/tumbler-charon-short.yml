name: 생활알고리즘 텀블러 실사 Gemini Charon 숏츠 (검토용)
on:
  push:
    paths:
      - '.github/workflows/tumbler-charon-short.yml'
      - 'make_tumbler_shorts.py'
      - 'gemini_charon_tts.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tumbler-charon-review
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install "google-genai>=1,<3" "Pillow>=10.4,<13" "requests>=2.31,<3"
      - name: Verify secret and compile
        run: |
          test -n "$GEMINI_API_KEY" || (echo "::error::GEMINI_API_KEY secret missing" && exit 1)
          python -m py_compile gemini_charon_tts.py make_tumbler_shorts.py
      - name: Produce real-stock-footage Charon video
        run: python -u make_tumbler_shorts.py
      - name: Archive draft MP4, audio timings and citations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tumbler-charon-short-review
          path: |
            out_tumbler_short/tumbler_review_short.mp4
            out_tumbler_short/captions.srt
            out_tumbler_short/script.txt
            out_tumbler_short/metadata.json
            out_tumbler_short/sources_and_rights.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Remind manual review
        if: success()
        run: |
          echo "### 텀블러 숏츠 검토본 제작 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "직접 재생하여 음성/자막/실사/사실/권리 검토 후 업로드하세요. 자동 게시는 하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
