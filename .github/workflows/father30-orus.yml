name: Father 30 - Gemini Orus 1.25x Anime Short
on:
  push:
    paths:
      - '.github/workflows/father30-orus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "google-genai>=1,<3"
      - name: Generate whole story single Orus voice once
        run: python -u father30_orus_2026.py
      - name: Save voiced master and script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: father30-gemini-orus-onevoice-125
          path: |
            father30_orus_output/*.wav
            father30_orus_output/*.mp3
            father30_orus_output/*.json
          retention-days: 7
          if-no-files-found: warn
