name: Father Remarriage Korean Gemini 3 voice production
on:
  push:
    paths:
      - '.github/workflows/father-remarriage-gemini.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Gemini and Korean ASR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "google-genai>=1,<3" "faster-whisper>=1.1,<2"
      - name: Record 3 consistent Gemini voices and align
        run: python -u father_remarriage_gemini_voices.py
      - name: Upload one-take voices and ASR matched dialogue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: father-remarriage-gemini-3voices
          path: |
            father_remarriage_audio/*.wav
            father_remarriage_audio/*.json
            father_remarriage_audio/*_asr.txt
          retention-days: 7
          if-no-files-found: warn