name: Friend secret Gemini Flash Lite voices
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/friend-secret-lite-20261125.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Generate dialogue groups with Gemini direct REST
        run: |
          python -u - <<'PY'
          from pathlib import Path
          import os,json,urllib.request,urllib.error,base64,wave,time,concurrent.futures,io
          GROUPS=json.loads("[[\"n\",\"15년 동안 알고 지낸 두 여자가 있었습니다. 어느 날 미정은 가장 친한 친구에게 속마음을 털어놓았습니다.\"],[\"w\",\"요즘 남편이랑 대화도 없고, 집에 있어도 혼자 있는 것 같아. 가끔은 내가 왜 이렇게 사나 싶어.\"],[\"f\",\"많이 힘들었겠다. 어디 가서 말도 못 했을 텐데… 나한테는 편하게 이야기해.\"],[\"n\",\"미정은 그날 친구에게 많은 위로를 받았습니다. 몇 달 뒤, 오랜 친구들과 함께 식사하는 자리였습니다.\"],[\"w\",\"우리 남편이 이번 주말에 여행 가자고 하더라. 오랜만에 둘이 다녀오려고.\"],[\"f\",\"어머, 남편이 이제 좀 잘해주나 봐? 얼마 전까지만 해도 혼자 사는 것 같다며?\"],[\"w\",\"야, 그 이야기는 왜 갑자기 해?\"],[\"f\",\"왜? 잘됐으니까 하는 말이지. 얘가 얼마 전에 나한테 남편 때문에 울고 난리도 아니었잖아.\"],[\"n\",\"다른 친구들의 시선이 미정에게 쏠렸습니다. 미정은 애써 웃으며 화제를 돌렸습니다. 모임이 끝난 뒤 미정은 친구에게 말했습니다.\"],[\"w\",\"내가 너 믿고 했던 이야기잖아. 다른 사람들 앞에서 굳이 그렇게 말해야 했어?\"],[\"f\",\"어머, 얘 좀 봐. 내가 없는 말 했니? 너도 참 피곤하게 산다.\"],[\"n\",\"사과를 기대했지만 오히려 자신이 예민한 사람이 되어 있었습니다. 그날 이후 미정은 그 친구에게 속마음을 털어놓지 않았습니다.\"],[\"n\",\"슬픔을 나누었다고 생각했는데, 어느 순간 그것은 누군가의 가벼운 이야깃거리가 되어 있었습니다.\"],[\"n\",\"나의 아픔을 안다는 것이 나를 함부로 대할 수 있는 권리는 아닙니다. 진정한 친구는 내 눈물을 기억하는 사람이 아니라, 그 눈물을 다른 사람 앞에서 꺼내지 않는 사람입니다.\"],[\"n\",\"이 이야기가 마음에 남으셨다면 구독과 좋아요 부탁드립니다.\"]]")
          OUT=Path("friend_secret_audio");OUT.mkdir(exist_ok=True)
          key=os.environ["GEMINI_API_KEY"]
          voices={"n":"Charon","w":"Kore","f":"Gacrux"}
          styles={"n":"Warm reflective Korean storyteller, restrained.","w":"Middle-aged Korean woman, vulnerable then quietly hurt, natural intimate speech.","f":"Middle-aged Korean woman, initially comforting, later casually smug and dismissive, subtle realistic delivery, not shouting."}
          def generate(item):
           i,(role,script)=item
           dest=OUT/f"raw_{i:02d}.wav"
           payload={"model":"gemini-3.8-flash-lite-tts","input":[{"type":"user_input","content":[{"type":"text","text":script,"annotations":[{"type":"speech_metadata","style":styles[role]+" Natural Korean, steady conversational pace. Read exactly the full text, no additions. Finish final syllables clearly."}]}]}],"response_format":{"type":"audio"},"generation_config":{"speech_config":[{"voice":voices[role]}]}}
           for attempt in range(2):
            try:
             print("REQUEST",i,attempt+1,flush=True)
             req=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/interactions",data=json.dumps(payload).encode(),headers={"Content-Type":"application/json","x-goog-api-key":key})
             with urllib.request.urlopen(req,timeout=45) as response:r=json.load(response)
             audio=[c for s in r.get("steps",[]) for c in s.get("content",[]) if c.get("type")=="audio" and c.get("data")]
             if not audio:raise RuntimeError("No audio: "+str(r.get("status")))
             data=base64.b64decode(audio[-1]["data"])
             if data[:4]==b"RIFF":dest.write_bytes(data)
             else:
              with wave.open(str(dest),"wb") as w:
               w.setnchannels(1);w.setsampwidth(2);w.setframerate(24000);w.writeframes(data)
             with wave.open(str(dest)) as w:d=w.getnframes()/w.getframerate()
             if d<0.4:raise RuntimeError("Empty audio")
             record={"i":i,"role":role,"voice":voices[role],"text":script,"file":dest.name,"duration":d}
             (OUT/f"line_{i:02d}.json").write_text(json.dumps(record,ensure_ascii=False),encoding="utf8")
             print("GENERATED",i,round(d,2),flush=True)
             time.sleep(5)
             return record
            except Exception as e:
             print("ERROR",i,attempt+1,str(e).replace(key,"[redacted]")[:350],flush=True)
             if isinstance(e,urllib.error.HTTPError):
              print("HTTP_DETAIL",e.read().decode(errors="replace")[:1000].replace(key,"[redacted]"),flush=True)
              if e.code in (429,403,404):raise SystemExit(1)
             if attempt==1:return {"i":i,"error":str(e).replace(key,"[redacted]")}
             time.sleep(65 if isinstance(e,urllib.error.HTTPError) and e.code==429 else 3)
          with concurrent.futures.ThreadPoolExecutor(max_workers=1) as ex:
           records=list(ex.map(generate,list(enumerate(GROUPS,1))))
          t=0
          for r in records:
           if "duration" in r:r["start"]=round(t,4);t+=r["duration"];r["end"]=round(t,4)
          (OUT/"manifest.json").write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding="utf8")
          print("TOTAL",round(t,3),"SUCCESS",sum("duration" in r for r in records),flush=True)
          if any("error" in r for r in records):raise SystemExit(1)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: friend-secret-lite-voices
          path: friend_secret_audio/
          retention-days: 7
