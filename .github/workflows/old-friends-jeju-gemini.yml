name: Gemini TTS 50-year male friendship Jeju original story
on:
  push:
    paths:
      - '.github/workflows/old-friends-jeju-gemini.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Reuse previously recorded Gemini male voices
        run: gh run download 44930288359 -n old-friends-jeju-voices-and-qa -D oldvoices
      - name: Reuse four validated Kore paragraph blocks
        run: gh run download 44930767295 -n old-friends-jeju-voices-and-qa -D oldparts
      - name: Generate Gemini voices and ASR-based word-safe boundaries
        run: python -u old_friends_jeju_gemini.py
      - name: Deliver source audio and synchronization manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-friends-jeju-voices-and-qa
          path: |
            old_friends_jeju_tts/*.wav
            old_friends_jeju_tts/*.json
            old_friends_jeju_tts/*_transcript.txt
          retention-days: 7
          if-no-files-found: warn