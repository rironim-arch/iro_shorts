name: Minho 2026 Gemini TTS deliverable
on:
  push:
    paths:
      - .github/workflows/minho-gemini90-20261123.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio and ASR dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Generate real Gemini Korean TTS in three voices and verify
        run: python -u minho_gemini90_20261123.py
      - name: Share generated audio for short editing
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('minho_gemini90_result')
          with zipfile.ZipFile(p/'individual_lines.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(p.glob('line_*.wav')): z.write(f,arcname=f.name)
          PY
          mkdir -p minho_gemini90_published
          cp minho_gemini90_result/{full.mp3,full.wav,captions.srt,manifest.json,individual_lines.zip} minho_gemini90_published/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minho_gemini90_published/
          git commit -m "Publish Gemini Minho 90 story audio with per-line files and caption sync"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minho-gemini-Kore-Algenib-Orus-20261123
          path: |
            minho_gemini90_result/full.mp3
            minho_gemini90_result/captions.srt
            minho_gemini90_result/manifest.json
            minho_gemini90_result/line_*.wav
          retention-days: 7
