name: 10 Year Friend - Gemini Kore TTS
on:
  push:
    paths:
      - '.github/workflows/friend-30-kore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "google-genai>=1,<3"
      - name: Generate full single Kore voice
        run: python -u friend_30_kore_2026.py
      - name: Save voice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friend-30-female-kore
          path: |
            friend_30_kore_output/*.wav
            friend_30_kore_output/*.mp3
            friend_30_kore_output/*.json
          retention-days: 7
          if-no-files-found: warn
