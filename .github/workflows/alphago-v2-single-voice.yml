name: AlphaGo v2 - continuous consistent voice and real moving scenes
on:
  push:
    paths:
      - 'alphago_unified_tts_and_stock.py'
      - '.github/workflows/alphago-v2-single-voice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render_assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio and video utilities
        run: python -m pip install "google-genai>=1,<3" imageio-ffmpeg requests
      - name: Single Charon take, 1.25x; download real motion footage
        run: python -u alphago_unified_tts_and_stock.py
      - name: Save voice and footage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphago-v2-consistent-charon-real-footage
          path: |
            alphago_v2_assets/full_charon_125.wav
            alphago_v2_assets/full_charon_original.wav
            alphago_v2_assets/transcript.json
            alphago_v2_assets/clip_*.mp4
            alphago_v2_assets/sources.txt
          if-no-files-found: warn
          retention-days: 14
