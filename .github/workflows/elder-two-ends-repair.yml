name: Repair father missing last words in 2 other lines
on:
  push:
    paths:
      - '.github/workflows/elder-two-ends-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Generate two full dialogue lines and ASR verify last words
        run: python -u father_two_missing_endings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: father-two-endings-verified
          path: |
            father_two_endings_repair/father_0_full.wav
            father_two_endings_repair/father_1_full.wav
            father_two_endings_repair/qa.json
          retention-days: 7
          if-no-files-found: warn