name: Understanding family Gemini missing lines
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/understanding-family-resume-20261126.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Generate dialogue groups with Gemini direct REST
        run: |
          python -u - <<'PY'
          from pathlib import Path
          import os,json,urllib.request,urllib.error,base64,wave,time,concurrent.futures,io
          GROUPS=json.loads("[[\"h\",\"정호야, 요즘 어떻게 지내?\",\"Casual affectionate greeting to a younger brother, genuine curiosity, relaxed conversational pitch.\"],[\"j\",\"그냥 그렇지 뭐. 요즘은 일하면서 새로운 것도 좀 배우고 있어.\",\"Casual, slightly hesitant, quietly optimistic, like an ordinary chat with an older brother.\"],[\"h\",\"이제 나이도 있는데, 그냥 하던 일 하면서 편하게 살지 그래?\",\"Gently concerned practical advice, no scolding, no sarcasm.\"],[\"j\",\"나도 앞으로 하고 싶은 일이 있거든.\",\"Soft but sincere, gently explaining a personal wish.\"],[\"h\",\"그래? 나는 굳이 그렇게까지 해야 하나 싶다.\",\"Mild surprise, matter-of-fact, no judgmental or aggressive emphasis.\"],[\"n\",\"정호는 자신의 생각을 한참 설명했습니다. 하지만 형과의 대화는 좀처럼 좁혀지지 않았습니다. 집으로 돌아오는 길, 아내가 말했습니다.\",\"Quiet observational storytelling, natural sentence pauses.\"],[\"w\",\"당신은 형님이 당신 마음을 알아줬으면 좋겠어?\",\"A caring wife, a genuinely curious gentle question, not counseling or lecturing.\"],[\"j\",\"응. 그래도 가족이니까.\",\"A little disappointed, soft and honest, natural small pause after 응.\"],[\"w\",\"형님은 형님대로 살아온 인생이 있잖아. 당신하고 생각이 다를 수도 있지.\",\"Warm reassuring everyday speech, no exaggerated sweetness, patient.\"],[\"j\",\"그런가… 내가 너무 이해받으려고 애썼나 봐.\",\"A small moment of realization, relaxed, thoughtful, not melodramatic.\"],[\"n\",\"사람은 저마다 살아온 경험을 통해 타인을 바라봅니다. 그래서 아무리 설명해도 이해하지 못하는 사람이 있고, 짧은 한마디에도 마음을 알아주는 사람이 있습니다.\",\"Reflective, measured narration with natural phrase grouping.\"],[\"n\",\"모든 사람에게 이해받으려 애쓰지 마세요. 서로의 생각이 다르다는 것을 인정하는 것만으로도 마음은 한결 편안해집니다.\",\"Warm conclusion, calmly spoken, not a lecture.\"],[\"n\",\"이 이야기가 마음에 남으셨다면 구독과 좋아요 부탁드립니다.\",\"Natural understated closing, consistent loudness and complete final syllable.\"]]")
          OUT=Path("understanding_family_resume");OUT.mkdir(exist_ok=True)
          key=os.environ["GEMINI_API_KEY"]
          voices={"n":"Charon","h":"Algenib","j":"Orus","w":"Kore"}
          styles={"n":"Korean male reflective narrator.","h":"Korean older brother, 56 years old.","j":"Korean middle-aged younger brother, 52 years old.","w":"Korean wife, 50 years old."}
          def generate(item):
           i,(role,script,acting)=item
           dest=OUT/f"raw_{i:02d}.wav"
           payload={"model":"gemini-3.8-flash-tts","input":[{"type":"user_input","content":[{"type":"text","text":script,"annotations":[{"type":"speech_metadata","style":styles[role]+" "+acting+" Natural Korean, steady conversational pace, natural connected phrasing, no shouting, no unnatural breathiness, no rushed syllables. Read exactly the full text, no additions. Finish final syllables clearly."}]}]}],"response_format":{"type":"audio"},"generation_config":{"speech_config":[{"voice":voices[role]}]}}
           for attempt in range(3):
            try:
             print("REQUEST",i,attempt+1,flush=True)
             req=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/interactions",data=json.dumps(payload).encode(),headers={"Content-Type":"application/json","x-goog-api-key":key})
             with urllib.request.urlopen(req,timeout=45) as response:r=json.load(response)
             audio=[c for s in r.get("steps",[]) for c in s.get("content",[]) if c.get("type")=="audio" and c.get("data")]
             if not audio:raise RuntimeError("No audio: "+str(r.get("status")))
             data=base64.b64decode(audio[-1]["data"])
             if data[:4]==b"RIFF":dest.write_bytes(data)
             else:
              with wave.open(str(dest),"wb") as w:
               w.setnchannels(1);w.setsampwidth(2);w.setframerate(24000);w.writeframes(data)
             with wave.open(str(dest)) as w:d=w.getnframes()/w.getframerate()
             if d<0.4:raise RuntimeError("Empty audio")
             record={"i":i,"role":role,"voice":voices[role],"text":script,"file":dest.name,"duration":d}
             (OUT/f"line_{i:02d}.json").write_text(json.dumps(record,ensure_ascii=False),encoding="utf8")
             print("GENERATED",i,round(d,2),flush=True)
             time.sleep(10)
             return record
            except Exception as e:
             print("ERROR",i,attempt+1,str(e).replace(key,"[redacted]")[:350],flush=True)
             if isinstance(e,urllib.error.HTTPError) and e.code==429:print('RATE_LIMIT',e.read().decode(errors='replace')[:500],flush=True)
             if attempt==2:return {"i":i,"error":str(e).replace(key,"[redacted]")}
             time.sleep(65 if isinstance(e,urllib.error.HTTPError) and e.code==429 else 3)
          with concurrent.futures.ThreadPoolExecutor(max_workers=1) as ex:
           records=list(ex.map(generate,[(i,g) for i,g in enumerate(GROUPS,1) if i in (8,10,11,12,13)]))
          t=0
          for r in records:
           if "duration" in r:r["start"]=round(t,4);t+=r["duration"];r["end"]=round(t,4)
          (OUT/"manifest.json").write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding="utf8")
          print("TOTAL",round(t,3),"SUCCESS",sum("duration" in r for r in records),flush=True)
          if any("error" in r for r in records):raise SystemExit(1)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: understanding-family-resume
          path: understanding_family_resume/
          retention-days: 7
