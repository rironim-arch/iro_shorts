name: Guard and Child Original Webtoon Voice
on:
  push:
    paths:
      - 'guard_child_short_tts.py'
      - '.github/workflows/guard-child-short-voice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check "google-genai>=1,<3" imageio-ffmpeg
      - name: Generate full Kore story narration
        run: python -u guard_child_short_tts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insaengani-guard-child-narration
          path: guard_and_child_audio/
          retention-days: 14
          if-no-files-found: warn
