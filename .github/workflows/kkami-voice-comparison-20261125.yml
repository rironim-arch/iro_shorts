name: Kkami three OpenAI acting voice samples
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kkami-voice-comparison-20261125.yml'
permissions:
  contents: read
jobs:
  voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q 'openai>=2,<5'
      - name: Record Coral Nova Sage in Korean
        run: python -u kkami_voice_comparison_20261125.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kkami-voice-comparison
          path: |
            kkami_voice_comparison/*.mp3
            kkami_voice_comparison/comparison_manifest.json
          retention-days: 7
