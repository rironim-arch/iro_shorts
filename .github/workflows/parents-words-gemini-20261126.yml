name: Parents words Gemini voices
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/parents-words-gemini-20261126.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Generate dialogue groups with Gemini direct REST
        run: |
          python -u - <<'PY'
          from pathlib import Path
          import os,json,urllib.request,urllib.error,base64,wave,time,concurrent.futures,io
          GROUPS=json.loads("[[\"n\",\"서른 해 전, 민수는 부모에게 늘 같은 말을 들었습니다.\"],[\"p\",\"너는 도대체 제대로 하는 게 뭐가 있냐?\"],[\"n\",\"고등학생이었던 민수는 아무 말도 하지 못했습니다. 그 말이 싫어서, 자신은 절대 부모처럼 살지 않겠다고 다짐했습니다.\"],[\"m\",\"이제 제 인생은 제가 알아서 할게요.\"],[\"n\",\"그렇게 세월이 흘러 민수도 한 아이의 아버지가 되었고, 부모님은 어느덧 노인이 되었습니다. 어느 날 어머니가 휴대전화를 내밀었습니다.\"],[\"w\",\"민수야, 이거 어떻게 하는 거니?\"],[\"m\",\"엄마는 도대체 제대로 하는 게 뭐가 있어? 그것도 못 하세요?\"],[\"n\",\"어머니는 조용히 휴대전화를 내려놓았습니다. 그때 곁에 있던 고등학생 아들이 차분하게 물었습니다.\"],[\"s\",\"아빠, 할머니한테 왜 그렇게 말해요?\"],[\"n\",\"민수는 그제야 자신이 그토록 싫어했던 부모의 말투를 닮아 있었다는 사실을 깨달았습니다.\"],[\"m\",\"엄마, 미안해요. 제가 다시 천천히 알려드릴게요.\"],[\"n\",\"부모의 말은 시간이 흘러 자녀의 말이 될 수 있습니다. 하지만 그 악순환은 지금부터라도 끊을 수 있습니다. 이 이야기가 마음에 남으셨다면 구독과 좋아요 부탁드립니다.\"]]")
          OUT=Path("parents_words_audio");OUT.mkdir(exist_ok=True)
          key=os.environ["GEMINI_API_KEY"]
          voices={"n":"Kore","p":"Orus","m":"Algieba","w":"Sulafat","s":"Puck"}
          styles={"n":"Warm Korean storyteller, reflective and clear.","p":"Adult Korean father, stern but not exaggerated.","m":"Korean adult son, naturally frustrated then genuinely apologetic.","w":"Elderly Korean mother, quiet, natural and gentle.","s":"Korean young male, calmly and respectfully asking a question."}
          def generate(item):
           i,(role,script)=item
           dest=OUT/f"raw_{i:02d}.wav"
           payload={"model":"gemini-3.8-flash-tts","input":[{"type":"user_input","content":[{"type":"text","text":script,"annotations":[{"type":"speech_metadata","style":styles[role]+" Natural Korean, steady conversational pace. Read exactly the full text, no additions. Finish final syllables clearly."}]}]}],"response_format":{"type":"audio"},"generation_config":{"speech_config":[{"voice":voices[role]}]}}
           for attempt in range(2):
            try:
             print("REQUEST",i,attempt+1,flush=True)
             req=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/interactions",data=json.dumps(payload).encode(),headers={"Content-Type":"application/json","x-goog-api-key":key})
             with urllib.request.urlopen(req,timeout=45) as response:r=json.load(response)
             audio=[c for s in r.get("steps",[]) for c in s.get("content",[]) if c.get("type")=="audio" and c.get("data")]
             if not audio:raise RuntimeError("No audio: "+str(r.get("status")))
             data=base64.b64decode(audio[-1]["data"])
             if data[:4]==b"RIFF":dest.write_bytes(data)
             else:
              with wave.open(str(dest),"wb") as w:
               w.setnchannels(1);w.setsampwidth(2);w.setframerate(24000);w.writeframes(data)
             with wave.open(str(dest)) as w:d=w.getnframes()/w.getframerate()
             if d<0.4:raise RuntimeError("Empty audio")
             record={"i":i,"role":role,"voice":voices[role],"text":script,"file":dest.name,"duration":d}
             (OUT/f"line_{i:02d}.json").write_text(json.dumps(record,ensure_ascii=False),encoding="utf8")
             print("GENERATED",i,round(d,2),flush=True)
             time.sleep(5)
             return record
            except Exception as e:
             print("ERROR",i,attempt+1,str(e).replace(key,"[redacted]")[:350],flush=True)
             if isinstance(e,urllib.error.HTTPError) and e.code==429:raise SystemExit(1)
             if attempt==1:return {"i":i,"error":str(e).replace(key,"[redacted]")}
             time.sleep(65 if isinstance(e,urllib.error.HTTPError) and e.code==429 else 3)
          with concurrent.futures.ThreadPoolExecutor(max_workers=1) as ex:
           records=list(ex.map(generate,list(enumerate(GROUPS,1))))
          t=0
          for r in records:
           if "duration" in r:r["start"]=round(t,4);t+=r["duration"];r["end"]=round(t,4)
          (OUT/"manifest.json").write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding="utf8")
          print("TOTAL",round(t,3),"SUCCESS",sum("duration" in r for r in records),flush=True)
          if any("error" in r for r in records):raise SystemExit(1)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parents-words-voices
          path: parents_words_audio/
          retention-days: 7
