name: Mother Photo Missing - Gemini Kore Sync
on:
  push:
    paths:
      - 'mother_photo_kore_20261120.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "google-genai>=1,<3"
      - name: Generate exact chapter-timed Kore audio
        run: python -u mother_photo_kore_20261120.py
      - name: Upload voice and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mother-photo-kore-voice
          path: |
            mother_photo_kore_output/*.wav
            mother_photo_kore_output/*.mp3
            mother_photo_kore_output/*.json
            mother_photo_kore_output/*.srt
          retention-days: 14
          if-no-files-found: warn
