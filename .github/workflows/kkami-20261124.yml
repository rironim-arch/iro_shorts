name: Kkami 15 years girl dog Gemini Kore narration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kkami-20261124.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini and forced alignment
        run: python -m pip install -q 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Generate Kkami single Kore voice clips
        run: python -u kkami_story_gemini_20261124.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kkami-gemini-voice-and-timing
          path: |
            kkami_gemini/clip_*.wav
            kkami_gemini/full.wav
            kkami_gemini/manifest.json
          retention-days: 7
