name: Somin Pilot - 1 to 2 min Kore Anime Proof
on:
  push:
    paths:
      - 'somin_pilot_2026.py'
      - '.github/workflows/somin-pilot-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    name: Create 1-2min proof; do not synthesize full film
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering tools and Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "google-genai>=1,<3" "Pillow>=10,<13" "faster-whisper>=1,<2"
      - name: Generate limited 1-2min Kore narration and cinematic webtoon frames
        run: python -u somin_pilot_2026.py
      - name: Export pilot MP4 and reference QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somin-1to2min-pilot-kore-anime
          path: |
            somin_pilot_output/*.mp4
            somin_pilot_output/*.wav
            somin_pilot_output/*.srt
            somin_pilot_output/*.ass
            somin_pilot_output/*manifest.json
            somin_pilot_output/*script.txt
            somin_pilot_output/board_*.png
          retention-days: 14
          if-no-files-found: warn
