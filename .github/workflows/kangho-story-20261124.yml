name: Kangho Korean story Gemini TTS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kangho-story-20261124.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -q 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Gemini Kore voice and word alignment
        run: python -u kangho_story_gemini_20261124.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kangho-gemini-kore-20261124
          path: |
            kangho_gemini/clip_*.wav
            kangho_gemini/full.wav
            kangho_gemini/manifest.json
          retention-days: 7
