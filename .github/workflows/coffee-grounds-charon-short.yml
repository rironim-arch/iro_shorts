name: 생활알고리즘 커피 찌꺼기 활용 숏츠 Gemini Charon (검토용)
on:
  push:
    paths:
      - '.github/workflows/coffee-grounds-charon-short.yml'
      - 'make_coffee_grounds_short.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coffee-grounds-charon-review
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video and TTS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install "google-genai>=1,<3" "Pillow>=10.4,<13" "requests>=2.31,<3"
      - name: Validate secret and Python syntax
        run: |
          test -n "$GEMINI_API_KEY" || (echo "::error::GEMINI_API_KEY not set" && exit 1)
          python -m py_compile gemini_charon_tts.py make_coffee_grounds_short.py
      - name: Produce review-only vertical coffee grounds Short
        run: python -u make_coffee_grounds_short.py
      - name: Save video and captions for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coffee-grounds-charon-short-review
          path: |
            out_coffee_grounds_short/coffee_grounds_review_short.mp4
            out_coffee_grounds_short/captions.srt
            out_coffee_grounds_short/script.txt
            out_coffee_grounds_short/metadata.json
            out_coffee_grounds_short/sources_and_rights.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Manual editorial review reminder
        if: success()
        run: |
          echo "### 커피 찌꺼기 숏츠 검토본 완성" >> "$GITHUB_STEP_SUMMARY"
          echo "음성·자막·실사 적합성·사실 검토 후 게시하세요. 자동 업로드 없음." >> "$GITHUB_STEP_SUMMARY"
