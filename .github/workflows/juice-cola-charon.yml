name: 생활알고리즘 과일주스 콜라 칼로리 Charon 원테이크
on:
  push:
    paths:
      - '.github/workflows/juice-cola-charon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'google-genai>=1,<2'
      - name: Generate a single consistent Charon male voiceover
        run: python juice_cola_charon_one_take.py
      - name: Archive voice and paragraph script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juice-cola-charon-one-take
          path: out_juice_short_charon/*
          if-no-files-found: warn
          retention-days: 14
