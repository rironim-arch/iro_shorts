name: Coffee grounds CTA final second only - direct download
on:
  push:
    paths:
      - '.github/workflows/coffee-grounds-final-second-download.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download existing coffee grounds MP4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download coffee-grounds-redesign-2026-11-12 --repo "$GITHUB_REPOSITORY" --pattern 'coffee_grounds_redesigned_mobile.mp4' --dir "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/coffee_grounds_redesigned_mobile.mp4"
      - name: Prepare FFmpeg without apt installation
        run: |
          python3 -m pip install --quiet --break-system-packages imageio-ffmpeg
          python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
      - name: Cover the old CTA with summary until final second
        run: |
          FF=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          INPUT="$RUNNER_TEMP/coffee_grounds_redesigned_mobile.mp4"
          "$FF" -hide_banner -loglevel error -y -ss 48.7 -i "$INPUT" -frames:v 1 "$RUNNER_TEMP/summary_frame.png"
          "$FF" -hide_banner -loglevel error -y -i "$INPUT" -loop 1 -framerate 30 -i "$RUNNER_TEMP/summary_frame.png" -filter_complex "[0:v][1:v]overlay=0:0:enable='between(t,49.024,50.77)':shortest=1[v]" -map "[v]" -map 0:a:0 -c:v libx264 -preset veryfast -crf 27 -pix_fmt yuv420p -c:a copy -movflags +faststart "$RUNNER_TEMP/coffee_grounds_FINAL_ONCE.mp4"
          test -s "$RUNNER_TEMP/coffee_grounds_FINAL_ONCE.mp4"
      - name: Create GitHub direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create coffee-grounds-final-second-2026-11-12 "$RUNNER_TEMP/coffee_grounds_FINAL_ONCE.mp4" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "생활알고리즘 커피 찌꺼기 - 마지막 1초 구독 좋아요" --notes "이전 버전과 구분되는 최종 수정본: 본문에 구독·좋아요 없음, 마지막 약 1초에 화면 1회 표시. Gemini Charon 음성 유지. 게시 전 검토." --latest=false
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/coffee-grounds-final-second-2026-11-12/coffee_grounds_FINAL_ONCE.mp4" >> "$GITHUB_STEP_SUMMARY"
