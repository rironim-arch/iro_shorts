name: Somin V2 Cinematic Anime Longform Kore
on:
  push:
    paths:
      - '.github/workflows/somin-v2-anime-longform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pictures:
    name: Draw 48 story specific Korean animation scenes
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "google-genai>=1,<3" "Pillow>=10,<13"
      - name: Generate original contextual illustrations with Somin likeness
        run: python -u somin_v2_illustrations.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somin-v2-story-illustrations
          path: somin_v2_art/
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

  voice:
    name: Re-record all chapters in one consistent Kore female narrator
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-nanum
      - run: python -m pip install "google-genai>=1,<3" "faster-whisper>=1.0,<2" "Pillow>=10,<13"
      - name: One Kore narrator, 1.25 speed, word-timed senior captions
        run: python -u somin_v2_audio.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somin-v2-kore-voice-and-captions
          path: |
            somin_v2_audio_output/somin_narration.wav
            somin_v2_audio_output/somin_v2.ass
            somin_v2_audio_output/somin_v2.srt
            somin_v2_audio_output/somin_v2_kore125.mp3
            somin_v2_audio_output/somin_v2_speech_alignment_QA.json
          retention-days: 14
          if-no-files-found: warn

  film:
    needs: [pictures, voice]
    name: Compose anime movie with gentle camera moves and large subtitles
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-nanum
      - uses: actions/download-artifact@v4
        with:
          name: somin-v2-story-illustrations
          path: somin_v2_art
      - uses: actions/download-artifact@v4
        with:
          name: somin-v2-kore-voice-and-captions
          path: somin_v2_audio_output
      - name: Final 16:9 cinematic animation, large synced senior subtitles, MP4
        run: python -u somin_v2_renderer.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somin-v2-cinematic-anime-mp4
          path: |
            somin_v2_release/*.mp4
            somin_v2_release/*.srt
            somin_v2_release/*.mp3
            somin_v2_release/*.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
