name: Father diary corrected Gemini narration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/father-diary-gemini-patch-20261124.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install narration and ASR tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q 'google-genai>=1,<3' 'faster-whisper>=1.1,<2'
      - name: Generate Gemini Kore and check actual word timing
        run: python -u father_diary_gemini_patch_20261124.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: father-diary-gemini-patch-20261124
          path: |
            father_diary_retake/clip_*.wav
            father_diary_retake/manifest.json
          retention-days: 7
