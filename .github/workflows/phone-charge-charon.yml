name: 생활알고리즘 휴대폰 충전 Charon 음성
on:
  push:
    paths:
      - '.github/workflows/phone-charge-charon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "google-genai>=1,<2"
      - name: Create consistent Charon narration
        run: python phone_charge_charon.py
      - name: Archive audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-charge-charon-voice
          path: out_phone_charon/*
          retention-days: 14
          if-no-files-found: warn
