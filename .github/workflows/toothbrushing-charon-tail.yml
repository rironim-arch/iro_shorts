name: 생활알고리즘 칫솔질 Charon 남은 음성
on:
  push:
    paths:
      - '.github/workflows/toothbrushing-charon-tail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  make-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google Gemini SDK
        run: python -m pip install "google-genai>=1.0,<2.0"
      - name: Generate remaining narration scenes slowly
        run: python brushing_charon_voice_tail.py
      - name: Save resulting audio files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toothbrushing-charon-tail
          path: output_brushing_tail/*
          retention-days: 14
          if-no-files-found: warn
