name: Mother Savings Gemini Kore Narration
on:
  push:
    paths:
      - 'mother_savings_kore.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q --disable-pip-version-check "google-genai>=1,<3" "imageio-ffmpeg>=0.6"
      - name: Generate Kore narration
        run: python -u mother_savings_kore.py
      - name: Upload narration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mother-savings-kore-audio
          path: mother_savings_voice_output/
          retention-days: 8
          if-no-files-found: warn
