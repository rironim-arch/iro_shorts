name: Mutt WWI - Gemini Kore TTS
on:
  push:
    paths:
      - '.github/workflows/mutt-ww1-kore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "google-genai>=1,<3"
      - name: Generate whole story with Gemini female Kore voice
        run: python -u mutt_ww1_kore_2026.py
      - name: Save narration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutt-ww1-gemini-kore-125
          path: |
            mutt_ww1_kore_output/*.wav
            mutt_ww1_kore_output/*.mp3
            mutt_ww1_kore_output/*.json
          retention-days: 7
          if-no-files-found: warn
