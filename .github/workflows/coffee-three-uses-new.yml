name: 생활알고리즘 새 커피 찌꺼기 3가지 활용 (검토용 영상)
on:
  push:
    paths:
      - '.github/workflows/coffee-three-uses-new.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fonts, ffmpeg, Google audio and video packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install "google-genai>=1,<3" "Pillow>=10.4,<13" "requests>=2.31,<3"
      - name: Check new script and exact one final CTA
        run: |
          test -n "$GEMINI_API_KEY" || (echo "::error::Missing GEMINI_API_KEY" && exit 1)
          python -m py_compile gemini_charon_tts.py make_coffee_three_uses_new.py
          python - <<'PY'
          import make_coffee_three_uses_new as m
          assert len(m.SCENES)==11
          assert all("구독" not in speech and "좋아요" not in speech and "구독" not in caption and "좋아요" not in caption for speech,caption,_ in m.SCENES[:-1])
          assert sum("구독과 좋아요" in speech for speech,_,_ in m.SCENES)==1
          assert m.SCENES[-1][2] is None
          print("Verified: 0 CTA in body, exactly 1 CTA in final scene")
          PY
      - name: Create fresh scenes and Gemini Charon audio
        run: python -u make_coffee_three_uses_new.py
      - name: Verify MP4 and captions are present
        run: |
          test -s out_coffee_three_uses/coffee_three_uses_FINAL.mp4
          test -s out_coffee_three_uses/captions.srt
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out_coffee_three_uses/coffee_three_uses_FINAL.mp4
          python - <<'PY'
          from pathlib import Path
          s=Path('out_coffee_three_uses/script.txt').read_text()
          assert s.count('구독과 좋아요')==1, 'Unexpected repeated CTA'
          assert s.strip().splitlines()[-1].startswith('구독과 좋아요'), 'CTA not final'
          print('CTA verified once in the final narration only')
          PY
      - name: Save video, captions and source notes for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coffee-three-uses-new-draft
          path: |
            out_coffee_three_uses/coffee_three_uses_FINAL.mp4
            out_coffee_three_uses/captions.srt
            out_coffee_three_uses/script.txt
            out_coffee_three_uses/sources.txt
            out_coffee_three_uses/metadata.json
          retention-days: 14
          if-no-files-found: warn
      - name: Publish direct-download MP4 for Android
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="coffee-three-uses-fresh-2026-11-12"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" out_coffee_three_uses/coffee_three_uses_FINAL.mp4 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" out_coffee_three_uses/coffee_three_uses_FINAL.mp4               --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"               --title "생활알고리즘 커피 찌꺼기 새 대본 - 탈취 염색 퇴비"               --notes "완전히 새 대본·새 영상. 720x1280, Gemini Charon 1.25x, 실사 중심. 구독과 좋아요는 마지막 장면에만 한 번. 검토 후 게시."               --latest=false
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/coffee_three_uses_FINAL.mp4" >> "$GITHUB_STEP_SUMMARY"
