name: Old man regret - Gemini Kore narration
on:
  push:
    paths:
      - '.github/workflows/old-man-regret-kore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Gemini
        run: python -m pip install "google-genai>=1,<3"
      - name: Narrate with Kore
        run: python -u old_man_regret_kore_2026.py
      - name: Save female Kore audio and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-man-regret-gemini-kore
          path: |
            old_man_regret_kore_output/*.mp3
            old_man_regret_kore_output/*_125.wav
            old_man_regret_kore_output/*.json
          retention-days: 7
          if-no-files-found: warn
