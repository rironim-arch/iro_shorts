name: Two Wolves - Quick Orus Raw Voice
on:
  push:
    paths:
      - '.github/workflows/two-wolves-quick-orus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only Gemini SDK, skip slow system package manager
        run: python -m pip install "google-genai>=1,<3"
      - name: Generate Orus raw audio without ffmpeg requirement
        run: |
          python -u two_wolves_orus_2026.py || test -s two_wolves_orus_output/two_wolves_orus_original.wav
      - name: Save original WAV and exact script for local encoding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-wolves-orus-original-fast
          path: |
            two_wolves_orus_output/two_wolves_orus_original.wav
            two_wolves_orus_output/script.json
          retention-days: 7
          if-no-files-found: warn
