name: Two Friends Webtoon Gemini Orus - Review MP4
on:
  workflow_dispatch:
    inputs:
      source_video_url:
        description: "Approved temporary HTTPS source video URL (do not put this in a public commit)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SOURCE_VIDEO_URL: ${{ inputs.source_video_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini Python and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "google-genai>=1,<3"
      - name: Generate Orus audio and assemble draft
        run: python -u two_friends_orus_20261121.py
      - name: Private review only - no posting
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-friends-orus-review-30fps
          path: |
            two_friends_orus_output/two_friends_final_orus_30fps.mp4
            two_friends_orus_output/gemini_orus_master.wav
            two_friends_orus_output/gemini_orus_master.mp3
            two_friends_orus_output/two_friends_actual_tts.srt
            two_friends_orus_output/qa.json
          retention-days: 7
          if-no-files-found: warn
