name: 생활알고리즘 전기 모기채 손 감전 안전 숏츠
on:
  push:
    paths:
      - '.github/workflows/electric-swatter-verified-short.yml'
      - 'create_electric_swatter_short_verified.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imaging, FFmpeg and Gemini speech SDK
        run: |
          python -m pip install --quiet --disable-pip-version-check "google-genai>=1,<3" "Pillow>=10,<13" "requests>=2.31,<3" "imageio-ffmpeg>=0.5,<1"
          python -m py_compile create_electric_swatter_short_verified.py
      - name: Verify Charon API secret
        run: test -n "$GEMINI_API_KEY" || (echo "::error::Missing GEMINI_API_KEY secret" && exit 1)
      - name: Produce original electric swatter safety video and independently audit each audio scene
        run: python -u create_electric_swatter_short_verified.py
      - name: Check single CTA and valid MP4 for review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('electric_swatter_review')
          q=json.loads((r/'qa.json').read_text(encoding='utf-8'))
          assert q['cta_in_body']==0
          assert q['cta_in_ending']==1
          assert q['spoken_cta_count']==1
          assert q['visual_cta_ending_only']
          assert q['photos_count']>=1
          assert (r/'electric_swatter_hand_contact.mp4').stat().st_size>300000
          print('PASS: actual spoken CTA exactly once, only in final scene.')
          PY
      - name: Save MP4, subtitles, license and transcript audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electric-swatter-review-video
          path: |
            electric_swatter_review/electric_swatter_hand_contact.mp4
            electric_swatter_review/captions.srt
            electric_swatter_review/script.txt
            electric_swatter_review/qa.json
            electric_swatter_review/sources.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Publish direct-download MP4 on GitHub
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="electric-swatter-safety-2026-11-12"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" electric_swatter_review/electric_swatter_hand_contact.mp4 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" electric_swatter_review/electric_swatter_hand_contact.mp4 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "생활알고리즘 - 전기 모기채 손이 닿으면? 감전 안전수칙" \
              --notes "한국소비자원 안전지침에 기반한 720x1280 Shorts 검토본. 공개 라이선스 사진 및 원본 교육 그래픽, Gemini Charon 1.25배속. 실제 음성 재인식 검사: 본문 CTA 0회, 엔딩 1회. 유튜브 자동 게시 없음." \
              --latest=false
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/electric_swatter_hand_contact.mp4" >> "$GITHUB_STEP_SUMMARY"
