name: Repair coffee narration repeated CTA and verify actual speech
on:
  push:
    paths:
      - '.github/workflows/repair-coffee-audio-final.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini SDK
        run: python -m pip install --quiet --disable-pip-version-check "google-genai>=1,<3"
      - name: Obtain real audio and independent previous voice QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p voice voice_audit
          gh run download 43060275648 --repo "$GITHUB_REPOSITORY" --name coffee-three-uses-charon-voice --dir voice
          gh run download 43072490989 --repo "$GITHUB_REPOSITORY" --name coffee-audio-cta-audit --dir voice_audit
          test -s voice/manifest.json
          test -s voice_audit/audit.json
      - name: Replace 7 contaminated voice clips and check actual recordings
        run: python -u repair_coffee_hallucinated_voice.py
      - name: Publish clean audited voice as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coffee-clean-voice-no-repeated-cta
          path: voice_clean/
          retention-days: 14
          if-no-files-found: warn
