name: Deokgu Return - Gemini Kore Voice
on:
  push:
    paths:
      - 'deokgu_kore_20261120.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deokgu_tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio generation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "google-genai>=1,<3"
      - name: Generate 17 synchronized Kore narration lines
        run: python -u deokgu_kore_20261120.py
      - name: Upload rendered voices and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deokgu-kore-20261120-narration
          path: |
            deokgu_voice_output/*.wav
            deokgu_voice_output/*.mp3
            deokgu_voice_output/*.json
            deokgu_voice_output/*.srt
          retention-days: 10
          if-no-files-found: warn
