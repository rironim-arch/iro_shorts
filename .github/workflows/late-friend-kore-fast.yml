name: Late Friend Kore Voice Fast
on:
  push:
    paths:
      - '.github/workflows/late-friend-kore-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini and packaged ffmpeg
        run: |
          python -m pip install --disable-pip-version-check -q "google-genai>=1,<3" "imageio-ffmpeg>=0.6"
          mkdir -p "$RUNNER_TEMP/ffbin"
          ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/ffbin/ffmpeg"
          echo "$RUNNER_TEMP/ffbin" >> "$GITHUB_PATH"
      - name: Render Kore voice
        run: python -u late_friend_kore_20261121.py
      - name: Upload voice and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: late-friend-kore-fast-20261121
          path: late_friend_kore_output/
          retention-days: 10
          if-no-files-found: warn
