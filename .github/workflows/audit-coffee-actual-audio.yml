name: AUDIT coffee voice repeated CTA from actual WAV
on:
  push:
    paths:
      - '.github/workflows/audit-coffee-actual-audio.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal Gemini SDK
        run: python -m pip install --quiet --disable-pip-version-check "google-genai>=1,<3"
      - name: Download actual narrated audio, not just script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p voice
          gh run download 43060275648 --repo "$GITHUB_REPOSITORY" --name coffee-three-uses-charon-voice --dir voice
          test -s voice/manifest.json
      - name: Independently transcribe every spoken sentence and test for repeated CTA
        run: python -u audit_coffee_tts_audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coffee-audio-cta-audit
          path: voice_audit/audit.json
          retention-days: 7
          if-no-files-found: warn
