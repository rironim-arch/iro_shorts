name: Psych Webtoon Sample - Charon Narration
on:
  push:
    paths:
      - 'psych_webtoon_story_audio.py'
      - '.github/workflows/psych-webtoon-charon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check "google-genai>=1,<3" imageio-ffmpeg
      - run: python -u psych_webtoon_story_audio.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psych-webtoon-charon-audio
          path: psych_story_audio/
          retention-days: 7
          if-no-files-found: warn
