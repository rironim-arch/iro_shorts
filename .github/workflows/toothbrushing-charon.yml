name: 생활알고리즘 - 올바른 칫솔질 Gemini 음성 만들기
on:
  push:
    paths:
      - '.github/workflows/toothbrushing-charon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  make-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini SDK
        run: python -m pip install "google-genai>=1.0,<2.0"
      - name: Create seven Korean narrated scenes with Charon
        run: python brushing_charon_voice.py
      - name: Save audio and script for Short
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toothbrushing-charon-voice
          path: |
            output_brushing/*
          retention-days: 14
          if-no-files-found: warn
