name: Family care resume and verify
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/family-care-resume-20261125.yml'
permissions:
  contents: read
  actions: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: family-care-voices
          path: family_care_audio
          github-token: ${{ github.token }}
          run-id: 45639836131
      - name: Generate dialogue groups with Gemini direct REST
        run: |
          python -u - <<'PY'
          from pathlib import Path
          import os,json,urllib.request,urllib.error,base64,wave,time,concurrent.futures,io
          GROUPS=json.loads("[[\"b\",\"셋째야, 네가 그렇게 엄마 옆에 붙어 있는 거, 혹시 집 때문에 그러는 거 아니냐?\"],[\"n\",\"어머니를 2년째 간병하던 셋째 딸 미정은 그 말을 듣고 손이 멈췄습니다. 아버지가 돌아가신 뒤, 치매 초기 진단을 받은 어머니를 돌보는 일은 모두 미정의 몫이었습니다.\"],[\"n\",\"큰오빠는 멀리 산다며, 둘째 언니는 바쁘다며 찾아오지 않았습니다. 병원에 모시고 가고, 밤마다 화장실에 모셔다 드리는 것도 미정이었습니다.\"],[\"g\",\"미정아, 미안해서 어떡하니.\"],[\"w\",\"엄마, 그런 말 하지 마. 내가 딸인데.\"],[\"n\",\"그러던 명절날, 형제들이 모였습니다.\"],[\"s\",\"솔직히 말해 봐. 네가 엄마 모시는 거, 다 이유 있는 거 아니야?\"],[\"b\",\"엄마 통장도 네가 관리하잖아. 나중에 재산 문제 생기면 복잡해진다고.\"],[\"w\",\"오빠, 그럼 지금까지 병원은 누가 모셨어? 밤마다 엄마 돌본 건 누군데?\"],[\"s\",\"남들도 다 그래. 그렇게 효도하는 척하는 사람이 결국 제일 많이 가져가더라.\"],[\"n\",\"몇 달 뒤 어머니가 쓰러졌습니다. 병원비를 정산하러 온 큰오빠는 미정이 챙겨둔 영수증과 이체 내역을 보게 됐습니다.\"],[\"n\",\"미정은 어머니 돈을 빼돌린 것이 아니라, 오히려 자신의 생활비를 줄여 병원비와 간병비를 보태고 있었습니다.\"],[\"b\",\"미정아, 왜 우리한테 말 안 했냐?\"],[\"w\",\"말해도 안 믿었겠지. 오빠랑 언니는 내가 왜 엄마를 돌보는지보다, 뭘 얻으려고 그러는지만 궁금했잖아.\"],[\"n\",\"큰오빠는 아무 말도 하지 못했습니다. 남의 효심을 계산으로 보는 사람. 어쩌면 상대가 아니라 자신의 마음을 보고 있는 것인지도 모릅니다.\"],[\"n\",\"이 이야기가 마음에 남으셨다면 구독과 좋아요 부탁드립니다.\"]]")
          OUT=Path("family_care_audio");OUT.mkdir(exist_ok=True)
          key=os.environ["GEMINI_API_KEY"]
          voices={"n":"Charon","b":"Algieba","s":"Gacrux","g":"Sulafat","w":"Kore"}
          styles={"n":"Natural Korean storyteller, steady and reflective, no melodrama.","b":"Korean older brother in his fifties, suspicious and casual at first, later ashamed and quiet.","s":"Korean older sister, skeptical, casually hurtful, realistic.","g":"Elderly Korean mother, gentle and frail, speak clearly.","w":"Korean middle-aged youngest daughter, caring at first, later hurt and calmly firm."}
          def generate(item):
           i,(role,script)=item
           dest=OUT/f"raw_{i:02d}.wav"
           payload={"model":"gemini-3.8-flash-lite-tts","input":[{"type":"user_input","content":[{"type":"text","text":script,"annotations":[{"type":"speech_metadata","style":styles[role]+" Natural Korean, steady conversational pace. Read exactly the full text, no additions. Finish final syllables clearly."}]}]}],"response_format":{"type":"audio"},"generation_config":{"speech_config":[{"voice":voices[role]}]}}
           for attempt in range(2):
            try:
             print("REQUEST",i,attempt+1,flush=True)
             req=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/interactions",data=json.dumps(payload).encode(),headers={"Content-Type":"application/json","x-goog-api-key":key})
             with urllib.request.urlopen(req,timeout=45) as response:r=json.load(response)
             audio=[c for s in r.get("steps",[]) for c in s.get("content",[]) if c.get("type")=="audio" and c.get("data")]
             if not audio:raise RuntimeError("No audio: "+str(r.get("status")))
             data=base64.b64decode(audio[-1]["data"])
             if data[:4]==b"RIFF":dest.write_bytes(data)
             else:
              with wave.open(str(dest),"wb") as w:
               w.setnchannels(1);w.setsampwidth(2);w.setframerate(24000);w.writeframes(data)
             with wave.open(str(dest)) as w:d=w.getnframes()/w.getframerate()
             if d<0.4:raise RuntimeError("Empty audio")
             record={"i":i,"role":role,"voice":voices[role],"text":script,"file":dest.name,"duration":d}
             (OUT/f"line_{i:02d}.json").write_text(json.dumps(record,ensure_ascii=False),encoding="utf8")
             print("GENERATED",i,round(d,2),flush=True)
             time.sleep(1)
             return record
            except Exception as e:
             print("ERROR",i,attempt+1,str(e).replace(key,"[redacted]")[:350],flush=True)
             if isinstance(e,urllib.error.HTTPError) and e.code==429:raise SystemExit(1)
             if attempt==1:return {"i":i,"error":str(e).replace(key,"[redacted]")}
             time.sleep(65 if isinstance(e,urllib.error.HTTPError) and e.code==429 else 3)
          with concurrent.futures.ThreadPoolExecutor(max_workers=1) as ex:
           records=list(ex.map(generate,[(i,g) for i,g in enumerate(GROUPS,1) if not (OUT/f'raw_{i:02d}.wav').exists()]))
          records=[json.loads((OUT/f'line_{i:02d}.json').read_text(encoding='utf8')) for i in range(1,len(GROUPS)+1)]
          t=0
          for r in records:
           if "duration" in r:r["start"]=round(t,4);t+=r["duration"];r["end"]=round(t,4)
          (OUT/"manifest.json").write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding="utf8")
          print("TOTAL",round(t,3),"SUCCESS",sum("duration" in r for r in records),flush=True)
          if any("error" in r for r in records):raise SystemExit(1)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-care-complete-voices
          path: family_care_audio/
          retention-days: 7

      - name: Verify Gemini audio with word timestamp transcription
        run: |
          python3 -u - <<'PY'
          import os,pathlib,wave,json,urllib.request,urllib.error,uuid,io
          root=pathlib.Path("qc");root.mkdir(exist_ok=True)
          paths={}
          for p in pathlib.Path("family_care_audio").rglob("raw_*.wav"):paths[int(p.stem.split("_")[-1])]=p
          assert sorted(paths)==list(range(1,17)), sorted(paths)
          bounds=[]
          buf=io.BytesIO()
          with wave.open(buf,"wb") as out:
           out.setnchannels(1);out.setsampwidth(2);out.setframerate(24000)
           t=0
           for i,p in sorted(paths.items()):
            with wave.open(str(p),"rb") as w:
             assert (w.getnchannels(),w.getsampwidth(),w.getframerate())==(1,2,24000)
             d=w.getnframes()/24000
             out.writeframesraw(w.readframes(w.getnframes()))
             bounds.append({"i":i,"start":t,"end":t+d});t+=d
          boundary=uuid.uuid4().hex
          parts=[]
          for k,v in [("model","whisper-1"),("language","ko"),("response_format","verbose_json"),("timestamp_granularities[]","word"),("timestamp_granularities[]","segment")]:
           parts.append(("--"+boundary+"\r\nContent-Disposition: form-data; name=\""+k+"\"\r\n\r\n"+v+"\r\n").encode())
          parts.append(("--"+boundary+"\r\nContent-Disposition: form-data; name=\"file\"; filename=\"story.wav\"\r\nContent-Type: audio/wav\r\n\r\n").encode()+buf.getvalue()+b"\r\n")
          parts.append(("--"+boundary+"--\r\n").encode())
          req=urllib.request.Request("https://api.openai.com/v1/audio/transcriptions",data=b"".join(parts),headers={"Authorization":"Bearer "+os.environ["OPENAI_API_KEY"],"Content-Type":"multipart/form-data; boundary="+boundary})
          try:
           with urllib.request.urlopen(req,timeout=90) as r: result=json.load(r)
          except urllib.error.HTTPError as e:
           print("ASR HTTP",e.code,e.read().decode(errors="replace")[:400]);raise SystemExit(1)
          (root/"asr.json").write_text(json.dumps({"bounds":bounds,"result":result},ensure_ascii=False),encoding="utf8")
          print("ASR words",len(result.get("words",[])),"duration",result.get("duration"),flush=True)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-care-qc
          path: qc/
          retention-days: 7
